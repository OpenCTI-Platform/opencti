[project]
name = "opencti-worker"
version = "0.0.0"
description = "OpenCTI worker, consumes the RabbitMQ queues and pushes the bundles to the platform."
requires-python = ">=3.10"
# never published on PyPI: PyPI rejects this classifier
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  # pycti of the same commit, provided by the uv workspace
  "pycti",
  "opentelemetry-api~=1.35.0",
  "opentelemetry-sdk~=1.35.0",
  "opentelemetry-exporter-prometheus==0.56b0",
  # Fix transitive dependencies from pycti ranges
  "starlette==1.3.1",
]

[tool.uv]
# scripts run directly from src/, nothing to build or install
package = false

[tool.uv.sources]
pycti = { workspace = true }

[tool.isort]
profile = "black"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
show_error_context = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "pika",
    "pika.adapters.blocking_connection",
    "pycti",
    "pycti.connector.opencti_connector_helper",
]
ignore_missing_imports = true

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "invalid-name",
    "missing-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "no-self-use",
]

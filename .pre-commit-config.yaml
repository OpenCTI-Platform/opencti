---
repos:
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args:
          - "--profile"
          - "black"
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
  # - repo: https://github.com/adrienverge/yamllint
  #   rev: v1.31.0
  #   hooks:
  #     - id: yamllint
  - repo: local
    hooks:
      - id: oxlint-graphql
        name: oxlint (opencti-graphql)
        entry: bash -c 'cd opencti-platform/opencti-graphql && yarn lint'
        language: system
        files: ^opencti-platform/opencti-graphql/src/.*\.[jt]sx?$
        pass_filenames: false
      - id: oxfmt-check-graphql
        name: oxfmt --check (opencti-graphql)
        entry: bash -c 'cd opencti-platform/opencti-graphql && yarn fmt:check'
        language: system
        files: ^opencti-platform/opencti-graphql/src/.*\.[jt]sx?$
        pass_filenames: false
      - id: oxlint-front
        name: oxlint (opencti-front)
        entry: bash -c 'cd opencti-platform/opencti-front && yarn lint'
        language: system
        files: ^opencti-platform/opencti-front/src/.*\.[jt]sx?$
        pass_filenames: false
      - id: oxfmt-check-front
        name: oxfmt --check (opencti-front)
        entry: bash -c 'cd opencti-platform/opencti-front && yarn fmt:check'
        language: system
        files: ^opencti-platform/opencti-front/src/.*\.[jt]sx?$
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      # Excludes added so you can run against all files versus only changed files in your commit and not impact
      # files which you do not control or are not essential to be linted:
      #    pre-commit run --all-files
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
                .circleci/(.*)|
                .devcontainer/(.*)|
                .github/(.*)|
                yarn.lock|
                LICENSE|
                (.*)/requirements.txt|
                opencti-platform/.dockerignore|
                opencti-platform/opencti-graphql/static/(.*)|
                opencti-platform/opencti-front/src/static/(.*)|
                opencti-platform/opencti-front/packages/(.*)
          )$
      - id: requirements-txt-fixer
      # Excludes added so you can run against all files versus only changed files in your commit and not impact
      # files which you do not control or are not essential to be linted:
      #    pre-commit run --all-files
      - id: trailing-whitespace
        exclude: |
          (?x)^(
                .circleci/config.yml|
                .devcontainer/(.*)|
                .github/(.*)|
                yarn.lock|
                LICENSE|
                (.*)/requirements.txt|
                opencti-platform/.dockerignore|
                opencti-platform/opencti-graphql/static/(.*)|
                opencti-platform/opencti-front/src/static/(.*)|
                opencti-platform/opencti-front/packages/(.*)
          )$

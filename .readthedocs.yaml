# .readthedocs.yaml
# Read the Docs configuration file for the Python client documentation
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz
  jobs:
    # uv installs pycti and the doc dependency group from the workspace lockfile
    # into the virtual environment that Read the Docs then uses to run Sphinx
    create_environment:
      # pinned release, verified against its SHA-256
      - sh scripts/ci/install-uv.sh "$HOME/.local/bin"
    install:
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH "$HOME/.local/bin/uv" sync --locked --package pycti --no-default-groups --group doc

# Build documentation in the client-python/docs/ directory with Sphinx
sphinx:
  configuration: client-python/docs/conf.py

# Optionally build your docs in additional formats such as PDF and ePub
formats: all

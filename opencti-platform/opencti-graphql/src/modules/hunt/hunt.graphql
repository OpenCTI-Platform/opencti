enum HuntType {
  telemetry
  infrastructure
}
enum HuntStatus {
  draft
  active
  paused
  retired
}
enum HuntSourceKind {
  analyst
  agent
  hub
}

type HuntNativeQuery {
  platform: String!
  language: String!
  query: String!
  pipeline: String
}
input HuntNativeQueryInput {
  platform: String!
  language: String!
  query: String!
  pipeline: String
}

type HuntStatisticsPoint {
  date: DateTime!
  value: Int!
}
type HuntStatisticsBucket {
  label: String!
  value: Int!
}
type HuntStatistics {
  runs_count: Int!
  completed_runs_count: Int!
  failed_runs_count: Int!
  autonomous_runs_count: Int!
  hits_total: Int!
  true_positive_count: Int!
  benign_count: Int!
  inconclusive_count: Int!
  pending_count: Int!
  last_run_at: DateTime
  hits_over_time: [HuntStatisticsPoint!]!
  runs_over_time: [HuntStatisticsPoint!]!
  runs_per_platform: [HuntStatisticsBucket!]!
  verdict_distribution: [HuntStatisticsBucket!]!
}

type HuntConfiguration {
  min_schedule_interval_minutes: Int!
}

type HuntSigmaValidation {
  valid: Boolean!
  errors: [String!]!
  title: String
  level: String
  logsource_product: String
  logsource_category: String
  logsource_service: String
  detection_fields: [String!]!
  attack_techniques: [String!]!
}

type Hunt implements BasicObject & StixCoreObject & StixDomainObject & StixObject {
  id: ID! # internal_id
  standard_id: String!
  entity_type: String!
  parent_types: [String!]!
  metrics:[Metric]
  # StixObject
  representative: Representative!
  x_opencti_stix_ids: [StixId]
  is_inferred: Boolean!
  spec_version: String!
  created_at: DateTime!
  updated_at: DateTime!
  x_opencti_modified_at: DateTime
  refreshed_at: DateTime
  draftVersion: DraftVersion
  # inferences
  x_opencti_inferences: [Inference]
  # StixCoreObject
  createdBy: Identity
  currentUserAccessRight: String
  numberOfConnectedElement: Int!
  objectMarking: [MarkingDefinition!]
  objectOrganization: [Organization!]
  objectLabel: [Label!]
  externalReferences(first: Int): ExternalReferenceConnection
  containersNumber: Number
  containers(first: Int, entityTypes: [String!]): ContainerConnection
  reports(first: Int): ReportConnection
  notes(first: Int): NoteConnection
  opinions(first: Int): OpinionConnection
  observedData(first: Int): ObservedDataConnection
  groupings(first: Int): GroupingConnection
  cases(first: Int): CaseConnection
  stixCoreRelationships(
    first: Int
    after: ID
    orderBy: StixCoreRelationshipsOrdering
    orderMode: OrderingMode
    fromId: StixRef
    toId: StixRef
    fromTypes: [String]
    toTypes: [String]
    relationship_type: String
    startTimeStart: DateTime
    startTimeStop: DateTime
    stopTimeStart: DateTime
    stopTimeStop: DateTime
    firstSeenStart: DateTime
    firstSeenStop: DateTime
    lastSeenStart: DateTime
    lastSeenStop: DateTime
    confidences: [Int]
    search: String
    filters: FilterGroup
  ): StixCoreRelationshipConnection
  stixCoreObjectsDistribution(
    relationship_type: [String]
    toTypes: [String]
    field: String!
    startDate: DateTime
    endDate: DateTime
    dateAttribute: String
    operation: StatsOperation!
    limit: Int
    order: String
    types: [String]
    filters: FilterGroup
    search: String
  ): [Distribution] @auth(for: [KNOWLEDGE, EXPLORE])
  stixCoreRelationshipsDistribution(
    field: String!
    operation: StatsOperation!
    startDate: DateTime
    endDate: DateTime
    dateAttribute: String
    isTo: Boolean
    limit: Int
    order: String
    elementWithTargetTypes: [String]
    fromId: [String]
    fromRole: String
    fromTypes: [String]
    toId: [String]
    toRole: String
    toTypes: [String]
    relationship_type: [String]
    confidences: [Int]
    search: String
    filters: FilterGroup
  ): [Distribution] @auth(for: [KNOWLEDGE, EXPLORE])
  opinions_metrics: OpinionsMetrics
  # StixDomainObject
  revoked: Boolean!
  confidence: Int
  lang: String
  created: DateTime
  modified: DateTime
  x_opencti_graph_data: String
  objectAssignee: [Assignee!]
  objectParticipant: [Participant!]
  avatar: OpenCtiFile
  fintelTemplates: [FintelTemplate!]
  filesFromTemplate(
    first: Int
    prefixMimeType: String
    after: ID
    orderBy: FileOrdering
    orderMode: OrderingMode
    search: String
    filters: FilterGroup
  ): FileConnection
  # Hunt
  name: String!
  description: String
  hypothesis: String
  hunt_type: HuntType!
  hunt_status: HuntStatus!
  hunt_source_kind: HuntSourceKind!
  sigma_rule: String
  sigmaValidation: HuntSigmaValidation
  native_queries: [HuntNativeQuery!]
  hunt_scope: String
  scopePlatforms: [SecurityPlatform!]
  hunt_schedule: String!
  trigger_filters: String
  hunt_pir_activation: Boolean
  time_window_hours: Int!
  expected_observables: [String!]
  benign_patterns: [String!]
  escalation_threshold: Int!
  hunt_max_results: Int
  last_run_at: DateTime
  last_run_status: String
  last_hits_count: Int
  next_run_at: DateTime
  hunt_pir_armed: Boolean
  hunt_pir_armed_at: DateTime
  huntTargets: [StixDomainObject!]
  huntTechniques: [AttackPattern!]
  huntSources: [StixDomainObject!]
  runs(
    first: Int
    after: ID
    orderBy: HuntRunsOrdering
    orderMode: OrderingMode
    filters: FilterGroup
  ): HuntRunConnection
  statistics(startDate: DateTime, endDate: DateTime, interval: String): HuntStatistics
  toStixBundle: String
  # Technical
  creators: [Creator!]
  toStix(version: Version): String
  importFiles(
    first: Int
    prefixMimeType: String
    after: ID
    orderBy: FileOrdering
    orderMode: OrderingMode
    search: String
    filters: FilterGroup
  ): FileConnection
  pendingFiles(
    first: Int
    after: ID
    orderBy: FileOrdering
    orderMode: OrderingMode
    search: String
    filters: FilterGroup
  ): FileConnection
  exportFiles(first: Int): FileConnection
  editContext: [EditUserContext!]
  connectors(onlyAlive: Boolean): [Connector]
  jobs(first: Int): [Work]
  status: Status
  workflowEnabled: Boolean
  workflowInstance: WorkflowInstance
  pirInformation(pirId: ID!): PirInformation @auth(for: [PIRAPI])
}

# Ordering
enum HuntsOrdering {
  name
  hunt_type
  hunt_status
  hunt_source_kind
  hunt_schedule
  last_run_at
  last_run_status
  last_hits_count
  next_run_at
  escalation_threshold
  created
  modified
  created_at
  updated_at
  creator
  objectMarking
  objectLabel
  x_opencti_workflow_id
  _score
}

# Relay connections
type HuntConnection {
  pageInfo: PageInfo!
  edges: [HuntEdge!]!
}
type HuntEdge {
  cursor: String!
  node: Hunt!
}

type HuntProposal {
  draft_id: ID!
  hunt: Hunt
}
type HuntPackImportResult {
  hunts: [Hunt!]!
  unresolved_refs: [String!]!
}
type HuntValidation {
  hunts_count: Int!
  runs: [HuntRun!]!
}

# Queries
type Query {
  hunt(id: String!): Hunt @auth(for: [KNOWLEDGE])
  hunts(
    first: Int
    after: ID
    orderBy: HuntsOrdering
    orderMode: OrderingMode
    filters: FilterGroup
    search: String
    toStix: Boolean
  ): HuntConnection @auth(for: [KNOWLEDGE])
  huntSigmaValidate(sigma_rule: String!): HuntSigmaValidation! @auth(for: [KNOWLEDGE])
  huntConfiguration: HuntConfiguration! @auth(for: [KNOWLEDGE])
  huntStatistics(huntId: ID, startDate: DateTime, endDate: DateTime, interval: String): HuntStatistics! @auth(for: [KNOWLEDGE])
  huntPackExport(ids: [ID!]!): String @auth(for: [KNOWLEDGE])
}

# Mutations
input HuntAddInput {
  stix_id: StixId
  x_opencti_stix_ids: [StixId]
  name: String! @constraint(minLength: 2, format: "not-blank")
  description: String
  hypothesis: String
  hunt_type: HuntType
  hunt_status: HuntStatus
  hunt_source_kind: HuntSourceKind
  sigma_rule: String
  native_queries: [HuntNativeQueryInput!]
  hunt_scope: String
  hunt_schedule: String
  trigger_filters: String
  hunt_pir_activation: Boolean
  time_window_hours: Int
  expected_observables: [String!]
  benign_patterns: [String!]
  escalation_threshold: Int
  hunt_max_results: Int
  huntTargets: [String!]
  huntTechniques: [String!]
  huntSources: [String!]
  confidence: Int
  revoked: Boolean
  lang: String
  createdBy: String
  objectMarking: [String]
  objectOrganization: [String]
  objectLabel: [String]
  externalReferences: [String]
  created: DateTime
  modified: DateTime
  clientMutationId: String
  update: Boolean
  file: Upload
  fileMarkings: [String]
  files: [Upload]
  filesMarkings: [[String]]
  noTriggerImport: [Boolean]
  embedded: [Boolean]
  x_opencti_modified_at: DateTime
  x_opencti_workflow_id: String
  upsertOperations: [EditInput!]
}

input HuntRunStartInput {
  security_platform_ids: [ID!]
  time_window_hours: Int
}

input HuntPlanInput {
  entity_ids: [ID!]!
  security_platform_ids: [ID!]
  agent_slug: String
  benign_patterns: [String!]
}

input HuntValidateFromEmulationInput {
  technique_id: String!
  security_platform_id: String
  security_platform_name: String
  inject_id: String!
  window_start: DateTime!
  window_end: DateTime!
  security_coverage_id: String
}

type Mutation {
  huntAdd(input: HuntAddInput!): Hunt @auth(for: [KNOWLEDGE_KNUPDATE])
  huntProposalAdd(input: HuntAddInput!, draftName: String): HuntProposal @auth(for: [KNOWLEDGE_KNUPDATE])
  huntDelete(id: ID!): ID @auth(for: [KNOWLEDGE_KNUPDATE_KNDELETE])
  huntFieldPatch(id: ID!, input: [EditInput]!, commitMessage: String, references: [String]): Hunt @auth(for: [KNOWLEDGE_KNUPDATE])
  huntContextPatch(id: ID!, input: EditContext!): Hunt @auth(for: [KNOWLEDGE_KNUPDATE])
  huntContextClean(id: ID!): Hunt @auth(for: [KNOWLEDGE_KNUPDATE])
  huntRelationAdd(id: ID!, input: StixRefRelationshipAddInput!): StixRefRelationship @auth(for: [KNOWLEDGE_KNUPDATE])
  huntRelationDelete(id: ID!, toId: StixRef!, relationship_type: String!): Hunt @auth(for: [KNOWLEDGE_KNUPDATE])
  huntRunStart(id: ID!, input: HuntRunStartInput): [HuntRun!]! @auth(for: [KNOWLEDGE_KNUPDATE])
  huntTestQuery(id: ID!, securityPlatformId: ID): HuntRun @auth(for: [KNOWLEDGE_KNUPDATE])
  huntPlan(input: HuntPlanInput!): HuntProposal @auth(for: [KNOWLEDGE_KNUPDATE])
  huntValidateFromEmulation(input: HuntValidateFromEmulationInput!): HuntValidation @auth(for: [KNOWLEDGE_KNUPDATE])
  huntPackImport(file: Upload!): HuntPackImportResult @auth(for: [KNOWLEDGE_KNUPDATE])
}

extend type Subscription {
  hunt(id: ID!): Hunt @auth(for: [KNOWLEDGE])
}

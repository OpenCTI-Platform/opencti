enum WorkflowExecutionStatus {
  pending
  completed
  error
}

type WorkflowActionConfig {
    type: String!
    params: JSON
}

type WorkflowSerializedState {
    statusId: String!
    order: Int
    onEnter: [WorkflowActionConfig!]
    onExit: [WorkflowActionConfig!]
}

type WorkflowSerializedTransition {
    from: [String!]!
    to: String
    event: String!
    asyncActions: [WorkflowActionConfig!]
    syncActions: [WorkflowActionConfig!]
    conditions: JSON
    comment: String
}

type WorkflowSchema {
    id: ID!
    name: String!
    published: Boolean!
    hasPublishedVersion: Boolean!
    errors: [WorkflowValidationError!]
    initialState: String!
    states: [WorkflowSerializedState!]!
    transitions: [WorkflowSerializedTransition!]!
}

type WorkflowValidationError {
    type: String!
    message: String!
    path: [WorkflowEntityRef!]
}

type WorkflowEntityRef {
    id: String!
    entity_type: String!
}

type WorkflowMigrationDiagnostic {
    type: String!
    message: String!
    statusId: String
}

# Unlike WorkflowSerializedState, a migrated state carries a fully-computed, sequential `order`
# (its final rank in the migrated sequence) — real workflow definitions have no ordering concept
# of their own (order is inferred from the transition graph), so this is specific to the
# legacy-Status migration preview.
type WorkflowMigrationState {
    statusId: String!
    order: Int!
}

# One result per StatusScope present in the entity type's current legacy Status set (never a
# single merged/blended definition across scopes, see convertStatusToDefinition in
# status-to-definition-converter.ts).
type WorkflowMigrationScopeResult {
    scope: StatusScope!
    initialState: String!
    # Always false: this is a read-only, unpersisted preview. Kept here so the shape already
    # matches a real WorkflowSchema for a smoother transition once an actual migration persists it.
    published: Boolean!
    hasPublishedVersion: Boolean!
    states: [WorkflowMigrationState!]!
    transitions: [WorkflowSerializedTransition!]!
    diagnostics: [WorkflowMigrationDiagnostic!]!
}

type WorkflowMigrationPreview {
    entityType: String!
    results: [WorkflowMigrationScopeResult!]!
}


extend type EntitySetting {
    workflow_configuration: Boolean
    workflow_id: String
    workflow_published_version_id: String
}

type WorkflowDefinitionMutationResult {
    id: ID!
    workflow_id: String
    target_type: String
    published: Boolean!
    errors: [WorkflowValidationError!]!
}

type WorkflowActionError {
    timestamp: DateTime
    message: String!
    source: String
}

type WorkflowPendingAsyncAction {
    id: ID!
    workId: String!
    type: String!
    status: String!
    processedCount: Int
    expectedCount: Int
    startedAt: DateTime
    lastActivityAt: DateTime
    errors: [WorkflowActionError!]
}

type WorkflowPendingTransition {
    event: String!
    toState: String!
    triggeredAt: DateTime!
    asyncActions: [WorkflowPendingAsyncAction!]!
    syncActions: [WorkflowActionConfig!]
}

type WorkflowTriggerResult {
    success: Boolean!
    newState: String
    reason: String
    status: Status
    instance: WorkflowInstance
    entity: BasicObject
    executionStatus: WorkflowExecutionStatus
    pendingTransition: WorkflowPendingTransition
}

type WorkflowTransition {
    event: String!
    toState: String!
    toStatus: Status
    comment: String
    actions: [String!]
    requiresShareOrganizationInput: Boolean
    requiresUnshareOrganizationInput: Boolean
}

type WorkflowLastHistoryEntry {
    state: String!
    event: String!
    user_id: String!
    timestamp: String!
    comment: String
}

type WorkflowInstance {
    id: ID!
    currentState: String!
    currentStatus: Status
    allowedTransitions: [WorkflowTransition!]!
    lastHistoryEntry: WorkflowLastHistoryEntry
    pendingStatus: WorkflowExecutionStatus
    pendingError: String
    pendingTransition: WorkflowPendingTransition
}

extend type DraftWorkspace {
    workflowInstance: WorkflowInstance @auth(for: [KNOWLEDGE_KNUPDATE], forDraft: [KNOWLEDGE_KNUPDATE])
}

extend type Query {
    workflowDefinition(entityType: String!, allowDraft: Boolean): WorkflowSchema @auth(for: [SETTINGS_SETCUSTOMIZATION])
    workflowDefinitionPublished(entityType: String!): Boolean @auth(for: [KNOWLEDGE_KNUPDATE])
    workflowMigrationPreview(entityType: String!): WorkflowMigrationPreview @auth(for: [SETTINGS_SETCUSTOMIZATION]) @ff(flags: ["ENTITY_WORKFLOW"])
    workflowInstance(entityId: String!): WorkflowInstance @auth(for: [KNOWLEDGE_KNUPDATE], forDraft: [KNOWLEDGE_KNUPDATE])
    allowedTransitions(entityId: String!): [WorkflowTransition!]! @auth(for: [KNOWLEDGE_KNUPDATE])
}

extend type Mutation {
    workflowDefinitionSet(entityType: String!, definition: String!): WorkflowDefinitionMutationResult @auth(for: [SETTINGS_SETCUSTOMIZATION])
    workflowDefinitionPublish(entityType: String!): WorkflowDefinitionMutationResult @auth(for: [SETTINGS_SETCUSTOMIZATION])
    workflowDefinitionRestorePublished(entityType: String!): WorkflowDefinitionMutationResult @auth(for: [SETTINGS_SETCUSTOMIZATION])
    workflowDefinitionDelete(entityType: String!): EntitySetting @auth(for: [SETTINGS_SETCUSTOMIZATION])
    triggerWorkflowEvent(entityId: String!, eventName: String!, comment: String, runtimeParams: JSON): WorkflowTriggerResult! @auth(for: [KNOWLEDGE_KNUPDATE])
    clearWorkflowPendingState(entityId: String!): WorkflowInstance! @auth(for: [SETTINGS])
    reportWorkflowAsyncActionResult(workflowInstanceId: String!, workflowActionId: String!, status: String!, error: String): Boolean @auth(for: [KNOWLEDGE_KNUPDATE])
}

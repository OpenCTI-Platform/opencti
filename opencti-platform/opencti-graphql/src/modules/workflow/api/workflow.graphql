enum WorkflowExecutionStatus {
  pending
  completed
  error
}

type WorkflowActionConfig {
    type: String!
    params: JSON
}

type WorkflowSerializedState {
    statusId: String!
    order: Int
    onEnter: [WorkflowActionConfig!]
    onExit: [WorkflowActionConfig!]
}

type WorkflowSerializedTransition {
    from: [String!]!
    to: String
    event: String!
    asyncActions: [WorkflowActionConfig!]
    syncActions: [WorkflowActionConfig!]
    conditions: JSON
    comment: String
}

type WorkflowSchema {
    id: ID!
    name: String!
    published: Boolean!
    hasPublishedVersion: Boolean!
    errors: [WorkflowValidationError!]
    initialState: String!
    states: [WorkflowSerializedState!]!
    transitions: [WorkflowSerializedTransition!]!
}

type WorkflowValidationError {
    type: String!
    message: String!
    path: [WorkflowEntityRef!]
}

type WorkflowEntityRef {
    id: String!
    entity_type: String!
}

type WorkflowMigrationDiagnostic {
    type: String!
    message: String!
    statusId: String
}

# Task 6, Step 2.1: one result per `StatusScope` present in the entity type's current legacy
# `Status` set (never a single merged/blended definition across scopes, see
# convertStatusToDefinition in status-to-definition-converter.ts).
type WorkflowMigrationScopeResult {
    scope: StatusScope!
    initialState: String!
    states: [WorkflowSerializedState!]!
    transitions: [WorkflowSerializedTransition!]!
    diagnostics: [WorkflowMigrationDiagnostic!]!
}

type WorkflowMigrationPreview {
    entityType: String!
    results: [WorkflowMigrationScopeResult!]!
}

# Task 5: result of triggering the legacy-status migration for one entity type. `status` mirrors
# `MigrateEntityTypeStatusStatus` in migrate-status-to-workflow-definition.ts
# ('migrated' | 'skipped_no_data' | 'skipped_already_migrated').
type MigrateEntityTypeStatusResult {
    entityType: String!
    status: String!
}

extend type EntitySetting {
    workflow_configuration: Boolean
    workflow_id: String
    workflow_published_version_id: String
}

type WorkflowDefinitionMutationResult {
    id: ID!
    workflow_id: String
    target_type: String
    published: Boolean!
    errors: [WorkflowValidationError!]!
}

type WorkflowActionError {
    timestamp: DateTime
    message: String!
    source: String
}

type WorkflowPendingAsyncAction {
    id: ID!
    workId: String!
    type: String!
    status: String!
    processedCount: Int
    expectedCount: Int
    startedAt: DateTime
    lastActivityAt: DateTime
    errors: [WorkflowActionError!]
}

type WorkflowPendingTransition {
    event: String!
    toState: String!
    triggeredAt: DateTime!
    asyncActions: [WorkflowPendingAsyncAction!]!
    syncActions: [WorkflowActionConfig!]
}

type WorkflowTriggerResult {
    success: Boolean!
    newState: String
    reason: String
    status: Status
    instance: WorkflowInstance
    entity: BasicObject
    executionStatus: WorkflowExecutionStatus
    pendingTransition: WorkflowPendingTransition
}

type WorkflowTransition {
    event: String!
    toState: String!
    toStatus: Status
    comment: String
    # Task 11: true when this transition's target state has no outgoing transitions of its own
    # (a terminal "closing" state) — the frontend uses this to offer dedicated closing-reason
    # capture only for transitions that actually close the entity.
    isClosingTransition: Boolean
    actions: [String!]
    requiresShareOrganizationInput: Boolean
    requiresUnshareOrganizationInput: Boolean
}

type WorkflowLastHistoryEntry {
    state: String!
    event: String!
    user_id: String!
    timestamp: String!
    comment: String
    # Task 11: dedicated closing-reason field, stored and displayed separately from `comment`.
    closing_reason: String
}

type WorkflowInstance {
    id: ID!
    currentState: String!
    currentStatus: Status
    allowedTransitions: [WorkflowTransition!]!
    lastHistoryEntry: WorkflowLastHistoryEntry
    pendingStatus: WorkflowExecutionStatus
    pendingError: String
    pendingTransition: WorkflowPendingTransition
    scope: String
}

extend type DraftWorkspace {
    workflowInstance: WorkflowInstance @auth(for: [KNOWLEDGE_KNUPDATE], forDraft: [KNOWLEDGE_KNUPDATE])
}

# Task 5, Step 0.3: workflowInstance is embedded per-type (strategy A), matching the existing
# per-type x_opencti_workflow_id pattern, on every entity type with a configurable workflow
# (i.e. `workflow_id` in its EntitySetting allow-list — see entitySetting-utils.ts). Only
# StixSightingRelationship and DraftWorkspace qualify today. The `forDraft` auth variant is
# DraftWorkspace-specific and does not apply here (frozen auth matrix, plan.md Task 5).
extend type StixSightingRelationship {
    workflowInstance: WorkflowInstance @auth(for: [KNOWLEDGE_KNUPDATE])
}

extend type Query {
    workflowDefinition(entityType: String!, allowDraft: Boolean, scope: StatusScope): WorkflowSchema @auth(for: [SETTINGS_SETCUSTOMIZATION])
    workflowDefinitionPublished(entityType: String!): Boolean @auth(for: [KNOWLEDGE_KNUPDATE])
    # Task 11 fix: distinct transition event names of the published GLOBAL-scope WorkflowDefinition,
    # exposed below workflowDefinition's SETTINGS_SETCUSTOMIZATION gate so the mass-edit "Apply
    # transition" toolbar option works for any KNOWLEDGE_KNUPDATE user (not just settings admins).
    workflowTransitionEvents(entityType: String!): [String!]! @auth(for: [KNOWLEDGE_KNUPDATE])
    workflowMigrationPreview(entityType: String!): WorkflowMigrationPreview @auth(for: [SETTINGS_SETCUSTOMIZATION])
    workflowInstance(entityId: String!): WorkflowInstance @auth(for: [KNOWLEDGE_KNUPDATE], forDraft: [KNOWLEDGE_KNUPDATE])
    allowedTransitions(entityId: String!): [WorkflowTransition!]! @auth(for: [KNOWLEDGE_KNUPDATE])
}

extend type Mutation {
    workflowDefinitionSet(entityType: String!, definition: String!, scope: StatusScope): WorkflowDefinitionMutationResult @auth(for: [SETTINGS_SETCUSTOMIZATION])
    workflowDefinitionPublish(entityType: String!, scope: StatusScope): WorkflowDefinitionMutationResult @auth(for: [SETTINGS_SETCUSTOMIZATION])
    workflowDefinitionRestorePublished(entityType: String!, scope: StatusScope): WorkflowDefinitionMutationResult @auth(for: [SETTINGS_SETCUSTOMIZATION])
    workflowDefinitionDelete(entityType: String!, scope: StatusScope): EntitySetting @auth(for: [SETTINGS_SETCUSTOMIZATION])
    # Task 5: triggers the legacy Status -> WorkflowDefinition migration for one entity type.
    # Only `scope: GLOBAL` is currently supported; RequestAccess-scoped migration is rejected
    # until a later task implements RequestAccessFlow.workflow_definition_id routing.
    migrateEntityTypeStatusToWorkflowDefinition(entityType: String!, scope: StatusScope!): MigrateEntityTypeStatusResult! @auth(for: [SETTINGS_SETCUSTOMIZATION])
    triggerWorkflowEvent(entityId: String!, eventName: String!, comment: String, runtimeParams: JSON, closingReason: String): WorkflowTriggerResult! @auth(for: [KNOWLEDGE_KNUPDATE])
    # Task 9: bypass-update — jump directly to any state of the published workflow, without
    # requiring an allowed-transition edge from the current state (unlike triggerWorkflowEvent).
    # `applyTransitionActions` runs only the current/target states' onEnter/onExit
    # actions-on-status when true; edge-level actions-on-transition never run in bypass mode.
    setWorkflowStatus(entityId: String!, targetStatusId: String!, applyTransitionActions: Boolean!, comment: String, closingReason: String): WorkflowTriggerResult! @auth(for: [KNOWLEDGE_KNUPDATE])
    clearWorkflowPendingState(entityId: String!): WorkflowInstance! @auth(for: [SETTINGS])
    reportWorkflowAsyncActionResult(workflowInstanceId: String!, workflowActionId: String!, status: String!, error: String): Boolean @auth(for: [KNOWLEDGE_KNUPDATE])
}

# Task 9, Step 1: generic apply-transition/bypass-update UI mount point on the entity view
# (Basic information section). Exposed on the StixDomainObject interface (and every concrete
# type implementing it, per GraphQL SDL rules requiring explicit re-declaration) so any entity
# type can surface workflowInstance once its EntitySetting.workflow_id references a published
# WorkflowDefinition (see Task 6's migration) — resolves to null until then, same as today's
# DraftWorkspace/StixSightingRelationship handling.
extend interface StixDomainObject {
    workflowInstance: WorkflowInstance @auth(for: [KNOWLEDGE_KNUPDATE])
}
# `Case` and `ThreatActor` are interfaces that themselves implement StixDomainObject, so per
# GraphQL SDL rules they must also redeclare workflowInstance (in addition to their concrete
# implementing types below).
extend interface Case {
    workflowInstance: WorkflowInstance @auth(for: [KNOWLEDGE_KNUPDATE])
}
extend interface ThreatActor {
    workflowInstance: WorkflowInstance @auth(for: [KNOWLEDGE_KNUPDATE])
}

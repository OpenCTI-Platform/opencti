enum WorkflowExecutionStatus {
  pending
  completed
  error
}

type WorkflowActionConfig {
    type: String!
    params: JSON
}

enum WorkflowRequestAccessOutcome {
    APPROVED
    DECLINED
}

type WorkflowSerializedState {
    statusId: String!
    order: Int
    onEnter: [WorkflowActionConfig!]
    onExit: [WorkflowActionConfig!]
    requestAccessOutcome: WorkflowRequestAccessOutcome
}

type WorkflowSerializedTransition {
    from: [String!]!
    to: String
    event: String!
    asyncActions: [WorkflowActionConfig!]
    syncActions: [WorkflowActionConfig!]
    conditions: JSON
    comment: String
    closingReason: String
}

type WorkflowSchema {
    id: ID!
    name: String!
    published: Boolean!
    hasPublishedVersion: Boolean!
    errors: [WorkflowValidationError!]
    initialState: String!
    states: [WorkflowSerializedState!]!
    transitions: [WorkflowSerializedTransition!]!
}

type WorkflowValidationError {
    type: String!
    message: String!
    path: [WorkflowEntityRef!]
}

type WorkflowEntityRef {
    id: String!
    entity_type: String!
}

enum WorkflowMigrationDiagnosticType {
    MISSING_ORDER
    DUPLICATE_ORDER
    DUPLICATE_TEMPLATE
    NAME_CONFLICT
    MISSING_TEMPLATE
    EXISTING_WORKFLOW
    REQUEST_ACCESS_OUTCOME_INVALID
}

type WorkflowMigrationDiagnostic {
    type: WorkflowMigrationDiagnosticType!
    message: String!
    # Id of the legacy Status entity the diagnostic is about.
    legacyStatusId: String
    # StatusTemplate id of that status, i.e. the statusId of the matching WorkflowMigrationState.
    templateId: String
}

# A migrated WorkflowSerializedState: its `order` is always set, to its final 0-based rank in the
# migrated sequence.
type WorkflowMigrationState {
    statusId: String!
    order: Int!
    requestAccessOutcome: WorkflowRequestAccessOutcome
}

# One result per StatusScope present in the entity type's current legacy Status set (never a
# single merged/blended definition across scopes, see convertStatusToDefinition in
# status-to-definition-converter.ts).
type WorkflowMigrationScopeResult {
    scope: StatusScope!
    initialState: String!
    # Whether the entity type's existing workflow for this scope has a published version, in which
    # case workflowMigrate refuses to replace it.
    hasPublishedVersion: Boolean!
    states: [WorkflowMigrationState!]!
    transitions: [WorkflowSerializedTransition!]!
    diagnostics: [WorkflowMigrationDiagnostic!]!
}

type WorkflowMigrationPreview {
    entityType: String!
    results: [WorkflowMigrationScopeResult!]!
}


extend type EntitySetting {
    workflow_configuration: Boolean
    workflow_id: String
    workflow_published_version_id: String
}

type WorkflowDefinitionMutationResult {
    id: ID!
    workflow_id: String
    target_type: String
    published: Boolean!
    errors: [WorkflowValidationError!]!
}

type WorkflowActionError {
    timestamp: DateTime
    message: String!
    source: String
}

type WorkflowPendingAsyncAction {
    id: ID!
    workId: String!
    type: String!
    status: String!
    processedCount: Int
    expectedCount: Int
    startedAt: DateTime
    lastActivityAt: DateTime
    errors: [WorkflowActionError!]
}

type WorkflowPendingTransition {
    event: String!
    toState: String!
    triggeredAt: DateTime!
    asyncActions: [WorkflowPendingAsyncAction!]!
    syncActions: [WorkflowActionConfig!]
}

type WorkflowTriggerResult {
    success: Boolean!
    newState: String
    reason: String
    status: Status
    instance: WorkflowInstance
    entity: BasicObject
    executionStatus: WorkflowExecutionStatus
    pendingTransition: WorkflowPendingTransition
}

type WorkflowTransition {
    event: String!
    toState: String
    toStatus: Status
    comment: String
    closingReason: String
    actions: [String!]
    requiresShareOrganizationInput: Boolean
    requiresUnshareOrganizationInput: Boolean
    # Outcome marked on the target state of a request access transition, null for any other transition.
    requestAccessOutcome: WorkflowRequestAccessOutcome
}

type WorkflowBypassStatus {
    status: Status!
    onExit: [WorkflowActionConfig!]!
    onEnter: [WorkflowActionConfig!]!
    requiresShareOrganizationInput: Boolean!
    requiresUnshareOrganizationInput: Boolean!
}

type WorkflowLastHistoryEntry {
    state: String!
    event: String!
    user_id: String!
    timestamp: String!
    comment: String
}

type WorkflowInstance {
    id: ID!
    currentState: String!
    currentStatus: Status
    allowedTransitions: [WorkflowTransition!]!
    lastHistoryEntry: WorkflowLastHistoryEntry
    pendingStatus: WorkflowExecutionStatus
    pendingError: String
    pendingTransition: WorkflowPendingTransition
    scope: String
}

extend type DraftWorkspace {
    workflowInstance: WorkflowInstance @auth(for: [KNOWLEDGE_KNUPDATE], forDraft: [KNOWLEDGE_KNUPDATE])
}

extend type Query {
    workflowDefinition(entityType: String!, allowDraft: Boolean, scope: StatusScope): WorkflowSchema @auth(for: [SETTINGS_SETCUSTOMIZATION])
    workflowDefinitionPublished(entityType: String!): Boolean @auth(for: [KNOWLEDGE_KNUPDATE])
    workflowStatuses(entityType: String!): [Status!]! @auth(for: [KNOWLEDGE_KNUPDATE]) @ff(flags: ["ENTITIES_WORKFLOW"], softFail: true, defaultValue: "[]")
    workflowMassTransitions(entityType: String!, entityIds: [String!], filters: String, search: String, excludedIds: [String!]): [WorkflowTransition!]! @auth(for: [KNOWLEDGE_KNUPDATE]) @ff(flags: ["ENTITIES_WORKFLOW"], softFail: true, defaultValue: "[]")
    workflowMigrationPreview(entityType: String!): WorkflowMigrationPreview @auth(for: [SETTINGS_SETCUSTOMIZATION])
    workflowInstance(entityId: String!): WorkflowInstance @auth(for: [KNOWLEDGE_KNUPDATE], forDraft: [KNOWLEDGE_KNUPDATE])
    allowedTransitions(entityId: String!): [WorkflowTransition!]! @auth(for: [KNOWLEDGE_KNUPDATE])
    workflowBypassStatuses(entityId: String!): [WorkflowBypassStatus!]! @auth(for: [BYPASS])
}

extend type Mutation {
    workflowDefinitionSet(entityType: String!, definition: String!, scope: StatusScope): WorkflowDefinitionMutationResult @auth(for: [SETTINGS_SETCUSTOMIZATION])
    workflowDefinitionPublish(entityType: String!, scope: StatusScope): WorkflowDefinitionMutationResult @auth(for: [SETTINGS_SETCUSTOMIZATION])
    # One-shot migration of the legacy Status set of a scope (GLOBAL by default; REQUEST_ACCESS for Case-Rfi only) into a workflow.
    # Fails if a workflow already exists for that scope, unless overwrite is true and that workflow was never published.
    # publish: true also requires the ENTITIES_WORKFLOW feature flag.
    workflowMigrate(entityType: String!, publish: Boolean = false, overwrite: Boolean = false, scope: StatusScope): WorkflowDefinitionMutationResult @auth(for: [SETTINGS_SETCUSTOMIZATION])
    workflowDefinitionRestorePublished(entityType: String!, scope: StatusScope): WorkflowDefinitionMutationResult @auth(for: [SETTINGS_SETCUSTOMIZATION])
    workflowDefinitionDelete(entityType: String!, scope: StatusScope): EntitySetting @auth(for: [SETTINGS_SETCUSTOMIZATION])
    triggerWorkflowEvent(entityId: String!, eventName: String!, comment: String, runtimeParams: JSON, closingReason: String): WorkflowTriggerResult! @auth(for: [KNOWLEDGE_KNUPDATE])
    setWorkflowStatus(entityId: String!, targetStatusId: String!, applyTransitionActions: Boolean!, comment: String, runtimeParams: JSON): WorkflowTriggerResult! @auth(for: [BYPASS])
    clearWorkflowPendingState(entityId: String!): WorkflowInstance! @auth(for: [BYPASS])
    reportWorkflowAsyncActionResult(workflowInstanceId: String!, workflowActionId: String!, status: String!, error: String): Boolean @auth(for: [BYPASS])
}

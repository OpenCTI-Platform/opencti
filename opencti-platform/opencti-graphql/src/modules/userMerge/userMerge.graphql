# Rationale for the defaults and the guard-rails lives in userMerge-domain.ts, not here:
# descriptions in this file are printed into the generated schema and exposed through
# introspection, so they are kept to what an API consumer needs.

enum UserMergeRightsStrategy {
    STRICT
    UNION
}

enum UserMergeStatus {
    RUNNING
    SUCCESS
    FAILED
}

input UserMergeOptions {
    dryRun: Boolean = true
    rightsStrategy: UserMergeRightsStrategy = STRICT
}

enum UserMergeDisposition {
    TRANSFER
    INVALIDATE
    CONDITIONAL
    RETAIN
    OUT_OF_SCOPE
}

type UserMergePlannedChange {
    register_row_id: String!
    entity_type: String!
    count: Int!
    # False when the count is an estimate. Anything affecting the security posture is exact.
    exact: Boolean!
    detail: String
}

type UserMergeRightsAlert {
    register_row_id: String!
    kind: String!
    message: String!
}

type UserMergeHandlerOutcome {
    handler: String!
    changes: [UserMergePlannedChange!]!
    alerts: [UserMergeRightsAlert!]!
    # Always 0 in dry mode.
    updated: Int!
}

type UserMergeExecutionReport {
    merge_id: ID!
    registry_version: String!
    handlers: [UserMergeHandlerOutcome!]!
    total_updated: Int!
    coverage: UserMergeCoverage!
}

type UserMergeCoverageRow {
    row_id: String!
    entity: String!
    path: String!
    disposition: UserMergeDisposition!
    covered: Boolean!
    handler: String
}

type UserMergeCoverage {
    registry_version: String!
    total: Int!
    covered_count: Int!
    uncovered_count: Int!
    # True only when every register row is claimed by a handler.
    is_complete: Boolean!
    rows: [UserMergeCoverageRow!]!
}

type UserMergeResult {
    id: ID!
    source_id: ID!
    target_id: ID!
    dry_run: Boolean!
    rights_strategy: UserMergeRightsStrategy!
    status: UserMergeStatus!
    started_at: DateTime!
    completed_at: DateTime
    message: String
    # Absent when the execution failed before any handler ran.
    report: UserMergeExecutionReport
}

type UserMergeJournalEntry {
    id: ID!
    merge_id: ID!
    source_id: ID!
    target_id: ID!
    handler: String!
    dry_run: Boolean!
    status: UserMergeStatus!
    started_at: DateTime!
    completed_at: DateTime
    message: String
}

extend type Query {
    # mergeId is optional: an operator who lost the connection also lost the id returned by
    # the mutation, so requiring it would defeat the point of the query.
    userMergeJournal(mergeId: ID, first: Int): [UserMergeJournalEntry!]! @auth(for: [BYPASS]) @ff(flags: ["MERGE_USERS"])
    # Counts always cover the whole register; disposition only narrows the returned rows.
    userMergeCoverage(disposition: UserMergeDisposition): UserMergeCoverage! @auth(for: [BYPASS]) @ff(flags: ["MERGE_USERS"])
}

extend type Mutation {
    # Runs synchronously; follow userMergeJournal to observe a run whose connection was cut.
    userMerge(sourceId: ID!, targetId: ID!, options: UserMergeOptions): UserMergeResult! @auth(for: [BYPASS]) @ff(flags: ["MERGE_USERS"])
}

# Case Autopilot: the OpenCTI, case-bound face of the XTM One investigation
# engine (Enterprise Edition). OpenCTI owns the run, the policy, the budget,
# the Draft, the approvals and every write; the engine investigates.

enum InvestigationRunStatus {
  planned
  running
  awaiting_approval
  completed
  failed
  cancelled
}

enum InvestigationRunTrigger {
  manual
  playbook
  case_rfi_creation
}

enum InvestigationRunPhase {
  initializing
  starting
  investigating
  ingesting
  awaiting_validation
  validating
  done
}

# The seven step states of the investigation engine.
enum InvestigationStepStatus {
  pending
  active
  completed
  empty
  degraded
  error
  skipped
}

enum InvestigationEvidenceKind {
  url
  document
  tool_result
  opencti_object
}

enum InvestigationEvidenceCategory {
  infrastructure_overlap
  tooling
  ttp_overlap
  victimology
  temporal
  source_reliability
  language_timezone
}

enum InvestigationConfidenceLabel {
  almost_certain
  very_likely
  likely
  roughly_even
  unlikely
  very_unlikely
  remote
}

enum InvestigationRecommendationActionKind {
  task
  course_of_action
  severity_change
  sharing
  notification
  case_closure
  other
}

enum InvestigationRecommendationPriority {
  P1
  P2
  P3
  P4
}

enum InvestigationRecommendationStatus {
  proposed
  awaiting_approval
  task_created
  applied
  dismissed
}

enum InvestigationApprovalKind {
  enrichment
  recommendation
  draft_validation
}

enum InvestigationApprovalStatus {
  pending
  approved
  rejected
}

enum InvestigationEnrichmentRequestStatus {
  queued
  awaiting_approval
  dispatched
  completed
  failed
  rejected
  timeout
  skipped
}

enum InvestigationEnrichmentWaveStatus {
  queued
  running
  completed
  partial
  awaiting_approval
  rejected
  timeout
}

enum InvestigationFeedbackItemType {
  hypothesis
  recommendation
}

enum InvestigationFeedbackDecision {
  accepted
  rejected
}

enum InvestigationAutonomousAction {
  enrichment
  create_case
  add_to_case
  create_note
  create_relationship
}

enum InvestigationRecommendationApplyMode {
  task
  course_of_action
}

# One source query of the engine, mirrored from its run.
type InvestigationStep {
  id: String!
  investigation_id: String!
  position: Int!
  action: String
  source_name: String!
  status: InvestigationStepStatus!
  detail_code: String
  detail_params: JSON
  findings_count: Int!
  evidence_count: Int!
  started_at: DateTime
  completed_at: DateTime
}

# A cited passage, document, tool result or OpenCTI object (shared shape).
type InvestigationEvidence {
  id: String!
  # The engine run whose citations number it (`n`); null for the case context.
  investigation_id: String
  n: Int
  kind: InvestigationEvidenceKind!
  label: String!
  href: String
  quote: String
  opencti_id: String
  entity_type: String
  in_draft: Boolean!
  # The engine step that found it (`InvestigationStep.id`); null for the case context.
  step_id: String
}

type InvestigationEntityReference {
  id: String!
  entity_type: String!
  name: String!
}

type InvestigationEvidenceCell {
  evidence_id: String!
  evidence_standard_id: String
  evidence_type: String
  evidence_name: String
  category: InvestigationEvidenceCategory!
  consistency: Int!
  weight: Float!
  diagnosticity: Float!
  rationale: String
}

type InvestigationHypothesis {
  candidate_id: String!
  candidate_standard_id: String
  candidate_name: String
  candidate_type: String
  rationale: String
  evidence: [InvestigationEvidenceCell!]!
  rank: Int!
  score: Float!
  inconsistency: Float!
  probability: Float!
  # Integer 0-100, null when no evidence assessed the hypothesis (never defaulted).
  confidence: Int
  confidence_label: InvestigationConfidenceLabel
  explanation: String!
  candidate: StixCoreObject
}

type InvestigationTimelineEvent {
  ts: DateTime!
  entity_id: String!
  entity_type: String!
  name: String
  event: String!
}

type InvestigationRecommendation {
  id: String!
  course_of_action_id: String
  text: String!
  priority: InvestigationRecommendationPriority!
  rationale: String
  action_kind: InvestigationRecommendationActionKind!
  severity: String
  approval_required: Boolean!
  status: InvestigationRecommendationStatus!
  task_id: String
  courseOfAction: CourseOfAction
}

type InvestigationFeedback {
  item_type: InvestigationFeedbackItemType!
  item_ref: String!
  decision: InvestigationFeedbackDecision!
  comment: String
  user_id: String!
  ts: DateTime!
  user: Creator
}

type InvestigationBudget {
  max_iterations: Int!
  max_enrichment_jobs: Int!
  max_minutes: Int!
  used_iterations: Int!
  used_enrichment_jobs: Int!
  used_minutes: Float!
}

type InvestigationApproval {
  id: String!
  kind: InvestigationApprovalKind!
  status: InvestigationApprovalStatus!
  description: String!
  reason: String
  connector_id: String
  entity_id: String
  recommendation_id: String
  created_at: DateTime!
  decided_at: DateTime
  decided_by: String
  decider: Creator
  rejection_reason: String
}

type InvestigationEnrichmentRequest {
  id: String!
  wave_id: String
  entity_id: String!
  connector_id: String!
  connector_name: String
  reason: String
  status: InvestigationEnrichmentRequestStatus!
  requested_by: String!
  work_id: String
  created_at: DateTime!
  completed_at: DateTime
}

type InvestigationEnrichmentJob {
  connector_id: String!
  connector_name: String!
  entity_id: String!
  work_id: String
  status: String!
  error: String
}

type InvestigationDeltaObject {
  id: String!
  standard_id: String
  entity_type: String!
  representative: String
  connector_name: String
  action: String!
}

type InvestigationEnrichmentWave {
  id: ID!
  status: InvestigationEnrichmentWaveStatus!
  requested_at: DateTime!
  completed_at: DateTime
  jobs: [InvestigationEnrichmentJob!]!
  delta: [InvestigationDeltaObject!]!
}

type InvestigationReportSource {
  n: Int!
  label: String!
  href: String
}

type InvestigationAcceptance {
  hypotheses_accepted: Int!
  hypotheses_rejected: Int!
  recommendations_accepted: Int!
  recommendations_rejected: Int!
  rate: Float
}

type InvestigationRunReport {
  executive_summary: String!
  report: String!
  timeline: String!
  hypotheses: String!
  recommendations: String!
  iocs: String!
}

type InvestigationRun implements InternalObject & BasicObject {
  id: ID!
  entity_type: String!
  standard_id: String!
  parent_types: [String!]!
  representative: Representative!
  metrics: [Metric]
  created_at: DateTime!
  updated_at: DateTime!
  refreshed_at: DateTime
  creators: [Creator!]
  objectMarking: [MarkingDefinition!]
  # Investigation run
  name: String!
  # Null, like case_id, while what the run found is withheld from a reader who cannot read its subject.
  subject_id: String
  subject_type: String!
  subject: StixCoreObject
  case_id: String
  case: Case
  workspace_id: String
  workspace: Workspace
  draft_id: String
  draft: DraftWorkspace
  policy_id: String
  policy: InvestigationPolicy
  agent_slug: String
  pack_id: String
  xtm_investigation_id: String
  xtm_investigation_ids: [String!]!
  xtm_revision: Int!
  xtm_status: String
  run_trigger: InvestigationRunTrigger!
  run_status: InvestigationRunStatus!
  run_phase: InvestigationRunPhase!
  status_reason: String
  end_reason_code: String
  started_at: DateTime
  completed_at: DateTime
  run_as_id: String!
  runAs: Creator
  goal_plan: JSON
  steps: [InvestigationStep!]!
  evidence: [InvestigationEvidence!]!
  hypotheses: [InvestigationHypothesis!]!
  timeline: [InvestigationTimelineEvent!]!
  recommendations: [InvestigationRecommendation!]!
  analyst_feedback: [InvestigationFeedback!]!
  approvals: [InvestigationApproval!]!
  enrichment_requests: [InvestigationEnrichmentRequest!]!
  # The entities of the enrichment jobs and approvals, as the reader sees them in the run draft.
  enrichment_entities: [InvestigationEntityReference!]!
  budget: InvestigationBudget!
  summary: String
  report: String
  report_sources: [InvestigationReportSource!]!
  report_id: String
  can_continue: Boolean!
  acceptance: InvestigationAcceptance!
  report_sections: InvestigationRunReport!
}

type InvestigationPolicy implements InternalObject & BasicObject {
  id: ID!
  entity_type: String!
  standard_id: String!
  parent_types: [String!]!
  representative: Representative!
  metrics: [Metric]
  created_at: DateTime!
  updated_at: DateTime!
  refreshed_at: DateTime
  creators: [Creator!]
  # Investigation policy
  name: String!
  description: String
  is_default: Boolean!
  agent_slug: String
  pack_id: String
  pack_options: JSON
  allowed_actions: [InvestigationAutonomousAction!]!
  # Who starts a run picks a policy and sees what it may do without asking; its connectors, approvals and identity
  # are for the users who manage customization
  enrichment_connector_ids: [String!]! @auth(for: [SETTINGS_SETCUSTOMIZATION])
  approval_connector_ids: [String!]! @auth(for: [SETTINGS_SETCUSTOMIZATION])
  auto_approve_low_risk: Boolean! @auth(for: [SETTINGS_SETCUSTOMIZATION])
  auto_approve_min_confidence: Int! @auth(for: [SETTINGS_SETCUSTOMIZATION])
  attribution_min_confidence: Int!
  max_iterations: Int!
  max_enrichment_jobs: Int!
  max_minutes: Int!
  trigger_on_case_rfi_creation: Boolean!
  run_as_id: String @auth(for: [SETTINGS_SETCUSTOMIZATION])
  runAs: Creator @auth(for: [SETTINGS_SETCUSTOMIZATION])
  runs_count: Int!
  acceptance: InvestigationAcceptance!
}

enum InvestigationRunsOrdering {
  created_at
  updated_at
  started_at
  completed_at
  run_status
  _score
}

enum InvestigationPoliciesOrdering {
  name
  created_at
  updated_at
  _score
}

type InvestigationRunConnection {
  pageInfo: PageInfo!
  edges: [InvestigationRunEdge!]!
}

type InvestigationRunEdge {
  cursor: String!
  node: InvestigationRun!
}

type InvestigationPolicyConnection {
  pageInfo: PageInfo!
  edges: [InvestigationPolicyEdge!]!
}

type InvestigationPolicyEdge {
  cursor: String!
  node: InvestigationPolicy!
}

type InvestigationRunEnrichmentAccepted {
  entity_id: String!
  connector_id: String!
  status: InvestigationEnrichmentRequestStatus!
}

type InvestigationRunEnrichmentRejected {
  entity_id: String!
  connector_id: String!
  reason: String!
}

type InvestigationRunEnrichmentRequestResult {
  wave_id: ID
  accepted: [InvestigationRunEnrichmentAccepted!]!
  rejected: [InvestigationRunEnrichmentRejected!]!
}

type InvestigationEnrichmentConnector {
  id: String!
  name: String!
  active: Boolean!
  connector_scope: [String!]!
}

type InvestigationPackChoice {
  value: String!
  label: String!
  description: String
}

type InvestigationPackOption {
  key: String!
  label: String!
  description: String
  default: String
  choices: [InvestigationPackChoice!]!
}

type InvestigationPack {
  slug: String!
  label: String!
  description: String
  recommended: Boolean!
  applicable_source_count: Int!
  total_source_count: Int!
  max_iterations: Int
  options: [InvestigationPackOption!]!
}

# Whether the connected XTM One runs investigations, and the packs a policy may name.
type InvestigationPackCatalog {
  available: Boolean!
  reason: String
  packs: [InvestigationPack!]!
}

# Live trigger and digest events raised by a run, delivered on its case (or on
# its subject while it has no case).
extend enum TriggerEventType {
  investigation_awaiting_approval
  investigation_completed
  investigation_failed
}

extend interface Case {
  latestInvestigationRun: InvestigationRun
}
extend type CaseIncident {
  latestInvestigationRun: InvestigationRun
}
extend type CaseRfi {
  latestInvestigationRun: InvestigationRun
}
extend type CaseRft {
  latestInvestigationRun: InvestigationRun
}
extend type Feedback {
  latestInvestigationRun: InvestigationRun
}
extend type Incident {
  latestInvestigationRun: InvestigationRun
}

type Query {
  investigationRun(id: ID!): InvestigationRun @auth(for: [KNOWLEDGE])
  investigationRuns(
    first: Int
    after: ID
    orderBy: InvestigationRunsOrdering
    orderMode: OrderingMode
    filters: FilterGroup
    search: String
    subjectId: String
    caseId: String
  ): InvestigationRunConnection @auth(for: [KNOWLEDGE])
  investigationRunEnrichmentWave(id: ID!, waveId: ID!): InvestigationEnrichmentWave @auth(for: [KNOWLEDGE])
  investigationPolicy(id: ID!): InvestigationPolicy @auth(for: [KNOWLEDGE, SETTINGS_SETCUSTOMIZATION])
  investigationPolicies(
    first: Int
    after: ID
    orderBy: InvestigationPoliciesOrdering
    orderMode: OrderingMode
    filters: FilterGroup
    search: String
  ): InvestigationPolicyConnection @auth(for: [KNOWLEDGE, SETTINGS_SETCUSTOMIZATION])
  investigationEnrichmentConnectors: [InvestigationEnrichmentConnector!]! @auth(for: [SETTINGS_SETCUSTOMIZATION])
  investigationPacks: InvestigationPackCatalog! @auth(for: [KNOWLEDGE])
}

input InvestigationRunFeedbackInput {
  item_type: InvestigationFeedbackItemType!
  item_ref: String!
  decision: InvestigationFeedbackDecision!
  comment: String @constraint(maxLength: 2000)
}

input InvestigationRunEnrichmentRequestInput {
  entity_ids: [String!]!
  connector_ids: [String!]!
  reason: String @constraint(maxLength: 2000)
}

input InvestigationPolicyAddInput {
  name: String! @constraint(minLength: 2, format: "not-blank")
  description: String
  is_default: Boolean
  agent_slug: String @constraint(maxLength: 200)
  pack_id: String @constraint(maxLength: 200)
  pack_options: JSON
  allowed_actions: [InvestigationAutonomousAction!]
  enrichment_connector_ids: [String!]
  approval_connector_ids: [String!]
  auto_approve_low_risk: Boolean
  auto_approve_min_confidence: Int @constraint(min: 0, max: 100)
  attribution_min_confidence: Int @constraint(min: 0, max: 100)
  max_iterations: Int @constraint(min: 1, max: 50)
  max_enrichment_jobs: Int @constraint(min: 0, max: 200)
  max_minutes: Int @constraint(min: 1, max: 1440)
  trigger_on_case_rfi_creation: Boolean
  run_as_id: String
}

type Mutation {
  investigationRunAdd(subjectId: ID!, policyId: ID, caseId: ID): InvestigationRun @auth(for: [KNOWLEDGE_KNUPDATE])
  investigationRunCancel(id: ID!): InvestigationRun @auth(for: [KNOWLEDGE_KNUPDATE])
  investigationRunContinue(id: ID!): InvestigationRun @auth(for: [KNOWLEDGE_KNUPDATE])
  investigationRunDelete(id: ID!): ID @auth(for: [KNOWLEDGE_KNUPDATE_KNDELETE])
  investigationRunFeedback(id: ID!, input: InvestigationRunFeedbackInput!): InvestigationRun @auth(for: [KNOWLEDGE_KNUPDATE])
  investigationRunRecommendationApply(id: ID!, recommendationId: String!, mode: InvestigationRecommendationApplyMode!): InvestigationRun @auth(for: [KNOWLEDGE_KNUPDATE])
  investigationRunEnrichmentRequest(id: ID!, input: InvestigationRunEnrichmentRequestInput!): InvestigationRunEnrichmentRequestResult @auth(for: [KNOWLEDGE_KNUPDATE])
  investigationPolicyAdd(input: InvestigationPolicyAddInput!): InvestigationPolicy @auth(for: [SETTINGS_SETCUSTOMIZATION])
  investigationPolicyFieldPatch(id: ID!, input: [EditInput!]!): InvestigationPolicy @auth(for: [SETTINGS_SETCUSTOMIZATION])
  investigationPolicyDelete(id: ID!): ID @auth(for: [SETTINGS_SETCUSTOMIZATION])
}

type Subscription {
  investigationRun(id: ID!): InvestigationRun @auth(for: [KNOWLEDGE])
}

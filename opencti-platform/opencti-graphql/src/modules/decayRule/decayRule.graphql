enum DecayRuleTargetScope {
  indicator
  relationship
  entity
}

enum KnowledgeFreshnessPolicy {
  flag
  lower_confidence
  revoke
}

type DecayRule implements InternalObject & BasicObject {
  id: ID!
  standard_id: String!
  entity_type: String!
  representative: Representative!
  parent_types: [String!]!
  metrics:[Metric]
  created_at: DateTime!
  updated_at: DateTime!
  refreshed_at: DateTime
  # DecayRule
  name: String!
  description: String
  order: Int!
  active: Boolean!
  built_in: Boolean
  appliedIndicatorsCount: Int!
  # Decay rule settings
  decay_lifetime: Int!
  decay_pound: Float!
  decay_points: [Int!]
  decay_revoke_score: Int!
  decaySettingsChartData: DecayData
  decay_filters: String
  # Knowledge decay (relationship and entity scopes), indicator scores are never affected
  target_scope: DecayRuleTargetScope!
  target_types: [String!]
  freshness_policy: KnowledgeFreshnessPolicy
  stale_after_days: Int
  freshness_confidence_step: Int
  staleElementsCount: Int!
}

type DecayData {
  live_score_serie: [DecayHistory!]
}

# Ordering
enum DecayRuleOrdering {
  name
  order
  _score
}

# Relay connections
type DecayRuleConnection {
  pageInfo: PageInfo!
  edges: [DecayRuleEdge!]!
}
type DecayRuleEdge {
  cursor: String!
  node: DecayRule!
}

# Queries
type Query {
  decayRule(id: String!): DecayRule @auth(for: [SETTINGS_SETCUSTOMIZATION])
  decayRules(
    first: Int
    after: ID
    orderBy: DecayRuleOrdering
    orderMode: OrderingMode
    filters: FilterGroup
    search: String
  ): DecayRuleConnection @auth(for: [SETTINGS_SETCUSTOMIZATION])
}

input DecayRuleAddInput {
  name: String! @constraint(minLength: 2, format: "not-blank")
  description: String
  order: Int!
  active: Boolean!
  # Decay rule settings
  decay_lifetime: Int!
  decay_pound: Float!
  decay_points: [Int!]
  decay_revoke_score: Int!
  decay_filters: String
}

input KnowledgeDecayRuleAddInput {
  name: String! @constraint(minLength: 2, format: "not-blank")
  description: String
  order: Int!
  active: Boolean!
  target_scope: DecayRuleTargetScope!
  # Relationship types (relationship scope) or entity types (entity scope), empty means every relationship type
  target_types: [String!]
  decay_filters: String
  freshness_policy: KnowledgeFreshnessPolicy!
  stale_after_days: Int! @constraint(min: 1)
  freshness_confidence_step: Int @constraint(min: 1, max: 100)
}

type Mutation {
  decayRuleAdd(input: DecayRuleAddInput!): DecayRule @auth(for: [SETTINGS_SETCUSTOMIZATION])
  knowledgeDecayRuleAdd(input: KnowledgeDecayRuleAddInput!): DecayRule @auth(for: [SETTINGS_SETCUSTOMIZATION])
  decayRuleDelete(id: ID!): ID @auth(for: [SETTINGS_SETCUSTOMIZATION])
  decayRuleFieldPatch(id: ID!, input: [EditInput!]!): DecayRule @auth(for: [SETTINGS_SETCUSTOMIZATION])
}

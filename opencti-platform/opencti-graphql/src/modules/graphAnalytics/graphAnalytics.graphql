enum GraphClusterKind {
    infrastructure
    campaign
    tooling
}

enum GraphClusterSource {
    platform
    analytics
}

enum GraphFeatureFamily {
    techniques
    tools
    malware
    infrastructure
    victims
    certificates
    asn
    registrar
    nameservers
    hosting
    reports
    objects
}

# region Graph metrics (x_opencti_graph_metrics on Stix Core Objects)
type GraphMetricsDegreeByType {
    relationship_type: String!
    count: Int!
}

type GraphMetrics {
    degree: Int
    degree_by_type: [GraphMetricsDegreeByType!]
    betweenness_approx: Float
    cluster_id: String
    cluster_size: Int
    cluster_kind: GraphClusterKind
    computed_at: DateTime
}
# endregion

# region Path finder
type StixPath {
    length: Int!
    node_ids: [ID!]!
    relationship_ids: [ID!]!
    relationship_types: [String!]!
    nodes: [StixCoreObject!]!
    relationships: [StixRelationship!]!
}

type StixPathsResult {
    from: StixCoreObject
    to: StixCoreObject
    paths: [StixPath!]!
    max_depth: Int!
    depth_reached: Int!
    explored_nodes: Int!
    explored_relationships: Int!
    truncated: Boolean!
    timed_out: Boolean!
    duration_ms: Int!
}

type StixNeighborhoodCount {
    label: String!
    value: Int!
}

type StixNeighborhoodPair {
    relationship_type: String!
    entity_type: String!
    value: Int!
}

type StixNeighborhoodSummary {
    id: ID!
    total: Int!
    by_relationship_type: [StixNeighborhoodCount!]!
    by_entity_type: [StixNeighborhoodCount!]!
    pairs: [StixNeighborhoodPair!]!
    truncated: Boolean!
}
# endregion

# region Similarity
type GraphSimilarityEvidence {
    family: GraphFeatureFamily!
    entities: [StixCoreObject!]!
}

type GraphSimilarEntity {
    id: ID!
    score: Float!
    jaccard: Float!
    structural: Float!
    computed_at: DateTime
    shared_count: Int!
    entity: StixCoreObject!
    evidence: [GraphSimilarityEvidence!]!
    securityCoverage: SecurityCoverage
}

type GraphSimilarEntityEdge {
    cursor: String!
    node: GraphSimilarEntity!
}

type GraphSimilarEntityConnection {
    pageInfo: PageInfo!
    edges: [GraphSimilarEntityEdge!]!
}

type GraphSimilarityMatrixCell {
    source_id: ID!
    target_id: ID!
    score: Float!
    shared_count: Int!
}

type GraphSimilarityMatrix {
    entities: [StixCoreObject!]!
    cells: [GraphSimilarityMatrixCell!]!
}
# endregion

# region Clusters
type GraphClusterFeature {
    family: GraphFeatureFamily!
    count: Int!
    entities: [StixCoreObject!]!
}

type GraphCluster implements InternalObject & BasicObject {
    id: ID!
    standard_id: String!
    entity_type: String!
    parent_types: [String!]!
    metrics: [Metric]
    representative: Representative!
    created_at: DateTime!
    updated_at: DateTime!
    name: String!
    cluster_id: String!
    cluster_kind: GraphClusterKind!
    cluster_source: GraphClusterSource!
    last_computed_at: DateTime
    "Number of members the current user can access"
    members_count: Int!
    "Maximum number of accessible members of a cluster that can be promoted to a Grouping or a Campaign"
    promotion_max_members: Int!
    representatives: [StixCoreObject!]!
    features: [GraphClusterFeature!]!
    promotedTo: [StixDomainObject!]!
    members(
        first: Int
        after: ID
        search: String
        types: [String]
        orderBy: StixCoreObjectsOrdering
        orderMode: OrderingMode
        filters: FilterGroup
    ): StixCoreObjectConnection
    timeline(startDate: DateTime, endDate: DateTime, interval: String!): [TimeSeries!]!
}

enum GraphClustersOrdering {
    cluster_kind
    members_count
    last_computed_at
    _score
}

type GraphClusterEdge {
    cursor: String!
    node: GraphCluster!
}

type GraphClusterConnection {
    pageInfo: PageInfo!
    edges: [GraphClusterEdge!]!
}

type GraphClusterTimeSeries {
    cluster: GraphCluster!
    data: [TimeSeries!]!
}
# endregion

# region Platform status and analytics process contract
type GraphAnalyticsStatus {
    manager_enabled: Boolean!
    pending_entities: Int!
    last_incremental_run: DateTime
    full_pass_in_progress: Boolean!
    last_full_pass_started_at: DateTime
    "End of the last full pass that reached the last entity"
    last_full_pass_completed_at: DateTime
    "End of the last full pass, whether it reached the last entity or stopped at its entity cap"
    last_full_pass_ended_at: DateTime
    "When the next full pass starts, null while one is running"
    next_full_pass_at: DateTime
    similarity_documents: Int!
    clusters_count: Int!
    analytics_process_active: Boolean!
    analytics_process_last_run_at: DateTime
    analytics_process_last_run_id: String
    analytics_process_version: String
}

type GraphAnalyticsEdge {
    id: ID!
    relationship_type: String!
    from_id: String!
    from_type: String!
    to_id: String!
    to_type: String!
}

type GraphAnalyticsEdgeEdge {
    cursor: String!
    node: GraphAnalyticsEdge!
}

type GraphAnalyticsEdgeConnection {
    pageInfo: PageInfo!
    edges: [GraphAnalyticsEdgeEdge!]!
}

type GraphAnalyticsUpsertResult {
    run_id: String!
    updated_entities: Int!
    skipped_entities: Int!
    upserted_clusters: Int!
    removed_clusters: Int!
}
# endregion

type Query {
    """
    Shortest paths between two entities, shortest first. Every intermediate entity of a returned path is at its
    minimal distance from one of the endpoints: a longer detour through an entity already reached by a shorter
    route is not returned, so this is not an exhaustive k shortest simple paths enumeration.
    """
    stixPaths(
        fromId: String!
        toId: String!
        maxDepth: Int
        maxPaths: Int
        relationshipTypes: [String!]
        entityTypes: [String!]
        includeInferred: Boolean
        includeContainers: Boolean
    ): StixPathsResult @auth(for: [KNOWLEDGE])
    stixNeighborhoodSummary(id: String!, includeInferred: Boolean): StixNeighborhoodSummary @auth(for: [KNOWLEDGE])
    similarEntities(
        id: String!
        first: Int
        minScore: Float
        entityTypes: [String!]
        onlyWithSecurityCoverage: Boolean
    ): GraphSimilarEntityConnection @auth(for: [KNOWLEDGE])
    """
    Pairwise similarity of explicit entities, or of the most connected entities matching types and filters.
    For a user who cannot read every relationship, the selection is made among the 500 most recently created matches,
    ranked by the relationships this user can see (both ends accessible); ranking every match would disclose hidden relationships.
    """
    graphSimilarityMatrix(ids: [String!], types: [String!], filters: FilterGroup, first: Int): GraphSimilarityMatrix @auth(for: [KNOWLEDGE, EXPLORE])
    graphCluster(id: String!): GraphCluster @auth(for: [KNOWLEDGE])
    "Clusters with members visible to the caller, among the 10,000 clusters with the most visible members: narrow with kinds or memberFilters beyond"
    graphClusters(
        first: Int
        after: ID
        search: String
        kinds: [GraphClusterKind!]
        sources: [GraphClusterSource!]
        orderBy: GraphClustersOrdering
        orderMode: OrderingMode
        filters: FilterGroup
        "Filters on the member entities: only clusters with matching members are listed"
        memberFilters: FilterGroup
    ): GraphClusterConnection @auth(for: [KNOWLEDGE])
    graphClustersSizeTimeSeries(
        kinds: [GraphClusterKind!]
        clusterIds: [String!]
        startDate: DateTime
        endDate: DateTime
        interval: String!
        limit: Int
        "Filters on the member entities: the largest clusters by matching members, counting only them"
        filters: FilterGroup
    ): [GraphClusterTimeSeries!]! @auth(for: [KNOWLEDGE, EXPLORE])
    graphAnalyticsStatus: GraphAnalyticsStatus @auth(for: [KNOWLEDGE])
    "Next entities waiting for a recompute, in processing order, among the ones the user can access"
    graphAnalyticsPendingEntities(first: Int): [StixCoreObject!]! @auth(for: [KNOWLEDGE])
    graphAnalyticsEdges(
        relationshipTypes: [String!]!
        includeInferred: Boolean
        first: Int
        after: ID
    ): GraphAnalyticsEdgeConnection @auth(for: [CONNECTORAPI, KNOWLEDGE], and: true)
}

enum GraphClusterPromotionTarget {
    Grouping
    Campaign
}

enum GraphAnalyticsPivotKind {
    similar_open
    similar_compare
    similar_investigation
    path_investigation
    path_expand
    cluster_investigation
}

input GraphClusterPromoteInput {
    target: GraphClusterPromotionTarget!
    name: String! @constraint(minLength: 2, format: "not-blank")
    description: String
    createdBy: String
    objectMarking: [String!]
    include_features: Boolean
}

input GraphAnalyticsEntityMetricInput {
    entity_id: String!
    betweenness_approx: Float
    cluster_id: String
    cluster_size: Int
    cluster_kind: GraphClusterKind
}

input GraphAnalyticsClusterFeatureInput {
    family: GraphFeatureFamily!
    ids: [String!]!
}

input GraphAnalyticsClusterInput {
    cluster_id: String!
    cluster_kind: GraphClusterKind!
    members_count: Int!
    representative_ids: [String!]!
    features: [GraphAnalyticsClusterFeatureInput!]
}

input GraphAnalyticsUpsertMetricsInput {
    run_id: String! @constraint(minLength: 1, maxLength: 128)
    process_version: String
    metrics: [GraphAnalyticsEntityMetricInput!]!
    clusters: [GraphAnalyticsClusterInput!]
    complete: Boolean
}

type Mutation {
    graphClusterPromote(id: ID!, input: GraphClusterPromoteInput!): StixDomainObject @auth(for: [KNOWLEDGE_KNUPDATE])
    graphClusterAddToInvestigation(id: ID!, investigationId: ID): Workspace @auth(for: [INVESTIGATION_INUPDATE])
    graphAnalyticsUpsertMetrics(input: GraphAnalyticsUpsertMetricsInput!): GraphAnalyticsUpsertResult @auth(for: [CONNECTORAPI, KNOWLEDGE_KNUPDATE], and: true)
    graphAnalyticsRequestRecompute(ids: [String!]!): Int @auth(for: [KNOWLEDGE_KNUPDATE])
    graphAnalyticsRecordPivot(kind: GraphAnalyticsPivotKind!): Boolean @auth(for: [KNOWLEDGE])
}

# Live trigger event: an entity matching the trigger joined a graph cluster when a clustering run was published
extend enum TriggerEventType {
    graph_cluster_joined
}

enum IngestionHealthStatus {
  critical
  healthy
  degraded
  unknown
}

enum IngestionHealthCheckKind {
  runtime
  configuration
}

enum IngestionHealthCheckSeverity {
  blocking
  advisory
}

type IngestionHealthCheck {
  health_check_code: String!
  health_check_message: String
  health_check_kind: IngestionHealthCheckKind!
  health_check_severity: IngestionHealthCheckSeverity!
}

type IngestionHealth {
  status: IngestionHealthStatus!
  status_since: DateTime!
  healthChecks: [IngestionHealthCheck!]!
}

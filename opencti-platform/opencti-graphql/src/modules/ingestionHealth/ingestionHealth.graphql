enum IngestionHealthStatus {
  critical
  healthy
  degraded
  unknown
}

enum IngestionHealthCheckKind {
  runtime
  configuration
}

enum IngestionHealthCheckSeverity {
  blocking
  advisory
}

type IngestionHealthCheck {
  health_check_code: String!
  # In English, may hold {key} placeholders to fill from health_check_metadata: the front translates it with them
  health_check_message: String
  # What describes this failure (e.g. the missing capability), for the front to render
  health_check_metadata: JSON
  health_check_kind: IngestionHealthCheckKind!
  health_check_severity: IngestionHealthCheckSeverity!
}

# A check of the registry, with whether it is evaluated on the platform
type IngestionHealthCheckSetting {
  health_check_code: String!
  # Name of the check, in English: translated by the front
  health_check_label: String!
  health_check_kind: IngestionHealthCheckKind!
  enabled: Boolean!
}

# Platform settings of the ingestion health, stored in the ingestion_health_settings object of the platform settings
type IngestionHealthSettings {
  # ms a status must stay unchanged before it is notified
  notification_delay: Int!
  # Codes of the checks never evaluated on the platform
  disabled_health_checks: [String!]!
  # Every check of the registry, enabled or not
  health_checks: [IngestionHealthCheckSetting!]!
}

type IngestionHealth {
  status: IngestionHealthStatus!
  status_since: DateTime!
  healthChecks: [IngestionHealthCheck!]!
}

# Fields left out are kept unchanged
input IngestionHealthSettingsInput {
  notification_delay: Int
  disabled_health_checks: [String!]
}

extend type Query {
  # Null when the feature is disabled: composed into the query of the Parameters page
  ingestionHealthSettings: IngestionHealthSettings @auth(for: [SETTINGS_SETPARAMETERS]) @ff(flags: ["INGESTION_HEALTH"], softFail: true)
}

extend type Mutation {
  ingestionHealthSettingsEdit(input: IngestionHealthSettingsInput!): IngestionHealthSettings @auth(for: [SETTINGS_SETPARAMETERS]) @ff(flags: ["INGESTION_HEALTH"])
}

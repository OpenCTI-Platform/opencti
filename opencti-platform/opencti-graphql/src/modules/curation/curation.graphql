enum CurationProposalKind {
  merge
  alias
  split
  contradiction
  stale
  relationship_conflict
  type_mismatch
  field_precedence
}

enum CurationProposalStatus {
  open
  accepted
  rejected
  auto_applied
  reverted
}

enum CurationDecision {
  alias
  merge
  distinct
  skip
}

enum MergeRecordStatus {
  pending
  active
  reverted
  partially_reverted
  irreversible
}

enum CurationPolicySourceClass {
  any
  connector
  manual
}

enum CurationRelationshipConflictMode {
  note
  detect_only
}

enum CurationAuthoritySourceType {
  author
  connector
}

type CurationEvidence {
  evidence_type: String!
  score: Float!
  weight: Float!
  description: String!
  details: String
}

type CurationAdjudication {
  decision: CurationDecision!
  rationale: String!
  agent_slug: String
  model: String
  adjudicated_at: DateTime!
  applied: Boolean!
  """True when OpenCTI itself obtained the adjudication from the agent bound to cti.curation_adjudicate."""
  verified: Boolean!
}

type CurationProposal implements InternalObject & BasicObject {
  id: ID!
  standard_id: String!
  entity_type: String!
  parent_types: [String!]!
  representative: Representative!
  metrics: [Metric]
  created_at: DateTime!
  updated_at: DateTime!
  objectMarking: [MarkingDefinition!]
  name: String!
  proposal_kind: CurationProposalKind!
  proposal_status: CurationProposalStatus!
  confidence_score: Float!
  in_ambiguous_band: Boolean!
  detector: String!
  subject_ids: [String!]!
  subject_types: [String!]!
  subject_names: [String!]!
  subjects: [StixObjectOrStixRelationship!]!
  restricted_subjects_count: Int!
  target_id: String
  recommended_action: String!
  action_payload: String
  evidence: [CurationEvidence!]!
  adjudication: CurationAdjudication
  adjudication_requested_at: DateTime
  policy_id: String
  policy: CurationPolicy
  decided_at: DateTime
  decidedBy: Creator
  decision_rationale: String
  merge_record_id: String
  mergeRecord: MergeRecord
  applied_patch: String
  can_apply: Boolean!
  """True when the proposal was applied, can be reverted, and the user holds the capability of the revert (an unmerge for a recorded merge)."""
  can_revert: Boolean!
  adjudicable: Boolean!
  """True when accepting takes a choice made on this proposal alone (the attribution to keep): it is accepted one at a time, never in a bulk accept nor by a policy."""
  choice_required: Boolean!
  """What the proposal changes, the evidence behind it, why, what its confidence means and what each decision does, in plain language."""
  explanation: CurationProposalExplanation!
}

"""One sentence of an explanation: the English text, and the template and values a client translates it from."""
type CurationExplanationMessage {
  """Translation key, with {placeholders} filled from the values."""
  template: String!
  """JSON object of the placeholder values."""
  values: String!
  text: String!
}

type CurationExplanationEntity {
  id: String!
  name: String!
  entity_type: String!
}

type CurationExplanationSource {
  name: String!
  reference: String
  url: String
}

type CurationExplanationChange {
  field: CurationExplanationMessage!
  before: [String!]!
  after: [String!]!
}

type CurationExplanationEvidence {
  message: CurationExplanationMessage!
  entities: [CurationExplanationEntity!]!
  sources: [CurationExplanationSource!]!
}

type CurationExplanationConfidence {
  score: Float!
  """high, medium or low."""
  level: String!
  meaning: CurationExplanationMessage!
}

type CurationProposalExplanation {
  title: CurationExplanationMessage!
  changes: [CurationExplanationChange!]!
  evidence: [CurationExplanationEvidence!]!
  why: CurationExplanationMessage!
  confidence: CurationExplanationConfidence!
  on_accept: CurationExplanationMessage!
  on_reject: CurationExplanationMessage!
  on_later: CurationExplanationMessage!
  """False when an accepted proposal cannot be reverted from the proposal."""
  reversible: Boolean!
  """The whole explanation as plain text."""
  text: String!
}

enum CurationProposalOrdering {
  created_at
  updated_at
  confidence_score
  proposal_kind
  proposal_status
  name
  decided_at
  _score
}

type CurationProposalConnection {
  pageInfo: PageInfo!
  edges: [CurationProposalEdge!]!
}

type CurationProposalEdge {
  cursor: String!
  node: CurationProposal!
}

type CurationStatisticsEntry {
  key: String!
  count: Int!
}

type CurationStatistics {
  open_count: Int!
  ambiguous_count: Int!
  open_by_kind: [CurationStatisticsEntry!]!
  decided_by_status: [CurationStatisticsEntry!]!
  active_merge_records_count: Int!
  latest_health_score: Int
  last_scan_date: DateTime
  curation_enabled: Boolean!
  "When the next scheduled scan is due; null when curation is turned off."
  next_scan_date: DateTime
  "When the next Knowledge health snapshot is due; null when the curation manager is turned off."
  next_snapshot_date: DateTime
}

type MergeRecordSource {
  id: String!
  standard_id: String!
  name: String!
  entity_type: String!
  aliases: [String!]!
  redirected_relationships_count: Int!
  recreatable_relationships_count: Int!

input CurationProposalAcceptInput {
  target_id: String
  rationale: String
  action_payload: String
  expected_updated_at: DateTime
}

input CurationProposalDecideInput {
  decision: CurationDecision!
  rationale: String!
  apply: Boolean
  agent_slug: String
  model: String
  target_id: String
  expected_updated_at: DateTime
}

input CurationPolicyAddInput {
  name: String! @constraint(minLength: 2, format: "not-blank")
  description: String
  policy_enabled: Boolean
  policy_entity_types: [String!]!
  policy_kinds: [CurationProposalKind!]!
  policy_source_class: CurationPolicySourceClass
  auto_apply_threshold: Float!
  forbid_open_contradiction: Boolean
  require_adjudication: Boolean
  max_applies_per_run: Int
}

input CurationAuthoritySourceInput {
  source_type: CurationAuthoritySourceType!
  source_id: String!
}

input CurationFieldAuthorityRuleInput {
  entity_type: String!
  attribute: String!
  sources: [CurationAuthoritySourceInput!]!
}

input CurationStalenessOverrideInput {
  entity_type: String!
  months: Int!
}

input CurationSettingsInput {
  curation_enabled: Boolean
  enabled_detectors: [String!]
  curated_entity_types: [String!]
  similarity_threshold: Float
  description_similarity_enabled: Boolean
  description_similarity_threshold: Float
  behavior_threshold: Float
  proposal_min_confidence: Float
  ambiguous_band_min: Float
  ambiguous_band_max: Float
  adjudication_enabled: Boolean
  adjudication_agent_slug: String
  adjudication_run_as_id: String
  adjudication_daily_limit: Int
  stale_default_months: Int
  stale_overrides: [CurationStalenessOverrideInput!]
  relationship_conflict_mode: CurationRelationshipConflictMode
  merge_record_retention_days: Int
  digest_enabled: Boolean
  digest_day: Int
  digest_recipient_ids: [String!]
  field_authority_enabled: Boolean
  field_authority_rules: [CurationFieldAuthorityRuleInput!]
  scan_max_entities_per_type: Int
}

type Query {
  curationProposal(id: ID!): CurationProposal @auth(for: [KNOWLEDGE])
  curationProposals(
    first: Int
    after: ID
    orderBy: CurationProposalOrdering
    orderMode: OrderingMode
    filters: FilterGroup
    search: String
  ): CurationProposalConnection @auth(for: [KNOWLEDGE])
  curationProposalsForEntity(id: ID!, status: [CurationProposalStatus!]): [CurationProposal!]! @auth(for: [KNOWLEDGE])
  curationStatistics: CurationStatistics! @auth(for: [KNOWLEDGE])
  curationResolve(name: String!, type: String!): CurationResolution @auth(for: [KNOWLEDGE])
  mergeRecord(id: ID!): MergeRecord @auth(for: [KNOWLEDGE])
  mergeRecords(
    first: Int
    after: ID
    orderBy: MergeRecordOrdering
    orderMode: OrderingMode
    filters: FilterGroup
    search: String
  ): MergeRecordConnection @auth(for: [KNOWLEDGE])
  curationPolicy(id: ID!): CurationPolicy @auth(for: [SETTINGS_SETCUSTOMIZATION])
  curationPolicies(
    first: Int
    after: ID
    orderBy: CurationPolicyOrdering
    orderMode: OrderingMode
    filters: FilterGroup
    search: String
  ): CurationPolicyConnection @auth(for: [SETTINGS_SETCUSTOMIZATION])
  curationPolicyDryRun(id: ID!): CurationPolicyDryRun @auth(for: [SETTINGS_SETCUSTOMIZATION])
  knowledgeHealth: KnowledgeHealthSnapshot @auth(for: [KNOWLEDGE])
  knowledgeHealthSnapshots(
    first: Int
    after: ID
    orderBy: KnowledgeHealthSnapshotOrdering
    orderMode: OrderingMode
    filters: FilterGroup
  ): KnowledgeHealthSnapshotConnection @auth(for: [KNOWLEDGE])
  curationSettings: CurationSettings! @auth(for: [SETTINGS_SETCUSTOMIZATION])
  "Whether the OpenCTI Curator can be asked to adjudicate a proposal (adjudication enabled and XTM One reachable)."
  curationAdjudicationAvailable: Boolean! @auth(for: [KNOWLEDGE])
  "What adjudication by XTM One needs on this platform, and the XTM One agents bound to curation adjudication."
  curationAdjudicationSetup: CurationAdjudicationSetup! @auth(for: [SETTINGS_SETCUSTOMIZATION])
  "The attributes a field authority rule can target, per curated entity type."
  curationAuthorityAttributes: [CurationAuthorityAttributes!]! @auth(for: [SETTINGS_SETCUSTOMIZATION])
}

type CurationAdjudicationAgent {
  agent_slug: String!
  agent_name: String!
}

type CurationAdjudicationSetup {
  enterprise_edition: Boolean!
  xtm_one_configured: Boolean!
  agents: [CurationAdjudicationAgent!]!
}

type CurationAuthorityAttribute {
  name: String!
  label: String!
}

type CurationAuthorityAttributes {
  entity_type: String!
  attributes: [CurationAuthorityAttribute!]!
}

type Mutation {
  curationProposalAccept(id: ID!, input: CurationProposalAcceptInput): CurationProposal @auth(for: [KNOWLEDGE_KNUPDATE])
  curationProposalReject(id: ID!, rationale: String): CurationProposal @auth(for: [KNOWLEDGE_KNUPDATE])
  curationProposalDecide(id: ID!, input: CurationProposalDecideInput!): CurationProposal @auth(for: [KNOWLEDGE_KNUPDATE])
  curationProposalApply(id: ID!, policy_id: ID, expected_updated_at: DateTime): CurationProposal @auth(for: [KNOWLEDGE_KNUPDATE])
  curationProposalAdjudicate(id: ID!): CurationProposal @auth(for: [KNOWLEDGE_KNUPDATE])
  curationProposalsBulkAccept(ids: [ID!]!): ID @auth(for: [KNOWLEDGE_KNUPDATE])
  curationProposalsBulkReject(ids: [ID!]!, rationale: String): [ID!]! @auth(for: [KNOWLEDGE_KNUPDATE])
  curationProposalRevert(id: ID!): CurationProposal @auth(for: [KNOWLEDGE_KNUPDATE])
  unmergeEntity(mergeRecordId: ID!, sourceIds: [ID!]): MergeRecord @auth(for: [KNOWLEDGE_KNUPDATE_KNMERGE])
  curationPolicyAdd(input: CurationPolicyAddInput!): CurationPolicy @auth(for: [SETTINGS_SETCUSTOMIZATION])
  curationPolicyFieldPatch(id: ID!, input: [EditInput!]!): CurationPolicy @auth(for: [SETTINGS_SETCUSTOMIZATION])
  curationPolicyDelete(id: ID!): ID @auth(for: [SETTINGS_SETCUSTOMIZATION])
  curationPolicyApply(id: ID!): ID @auth(for: [SETTINGS_SETCUSTOMIZATION])
  curationSettingsEdit(input: CurationSettingsInput!): CurationSettings @auth(for: [SETTINGS_SETCUSTOMIZATION])
  curationScanRequest: CurationSettings @auth(for: [SETTINGS_SETCUSTOMIZATION])
  knowledgeHealthRefresh: KnowledgeHealthSnapshot @auth(for: [SETTINGS_SETCUSTOMIZATION])
}

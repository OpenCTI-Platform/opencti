enum SourceKind {
  connector
  ingestion_feed
  author
  manual
}

enum SourceCostPeriod {
  month
  quarter
  year
}

enum SourceScorecardPeriod {
  LAST_7_DAYS
  LAST_30_DAYS
  LAST_90_DAYS
}

enum SourceRecommendationKind {
  raise_confidence
  lower_confidence
  add_decay_rule
  change_schedule
  add_deny_list
  quarantine
  retire
  add_connector
}

enum SourceRecommendationStatus {
  proposed
  applying
  applied
  reverting
  dismissed
  reverted
  failed
}

enum SourceProvenanceMode {
  assertions
  creators
}

enum SourceScorecardAggregation {
  sum
  avg
  min
  max
}

type SourceCost {
  amount: Float!
  currency: String!
  period: SourceCostPeriod!
}

type SourceOverlapShare {
  source_id: ID!
  source: Source
  shared_count: Int!
  share: Float!
}

type SourceScorecard {
  id: ID!
  source_id: ID!
  source_kind: SourceKind!
  source_name: String
  period: SourceScorecardPeriod!
  period_start: DateTime!
  period_end: DateTime!
  scorecard_date: String!
  computed_at: DateTime!
  is_live: Boolean!
  provenance_mode: SourceProvenanceMode
  # Volume
  volume_total: Int!
  volume_entities: Int!
  volume_relationships: Int!
  volume_indicators: Int!
  volume_observables: Int!
  new_objects: Int!
  volume_last_day: Int!
  # Uniqueness and corroboration
  unique_count: Int!
  unique_contribution: Float!
  corroborated_count: Int!
  corroboration_rate: Float!
  # Lead time
  shared_count: Int!
  lead_time_hours: Float
  first_reporter_share: Float
  # Accuracy
  evaluated_count: Int!
  revoked_count: Int!
  negative_sightings_count: Int!
  false_positive_count: Int!
  decay_excluded_count: Int!
  accuracy: Float
  # Relevance (Enterprise Edition)
  pir_matched_count: Int
  relevance: Float
  # Impact
  sightings_count: Int!
  security_platform_sightings_count: Int!
  hunt_true_positives_count: Int!
  incidents_count: Int!
  impact_score: Float!
  # Noise
  unreferenced_count: Int!
  unsighted_count: Int!
  expired_count: Int!
  noise_count: Int!
  noise: Float
  # Freshness
  last_asserted_at: DateTime
  freshness_hours: Float
  median_latency_hours: Float
  # Cost
  actionable_count: Int!
  cost_per_actionable_object: Float
  cost_currency: String
  # Threat Pulse
  community_known_count: Int
  community_uniqueness: Float
  # Synthesis
  value_score: Float!
  overlap: [SourceOverlapShare!]!
}

type Source implements InternalObject & BasicObject {
  id: ID!
  entity_type: String!
  representative: Representative!
  standard_id: String!
  parent_types: [String!]!
  metrics: [Metric]
  created_at: DateTime!
  updated_at: DateTime!
  # Source
  name: String!
  description: String
  source_kind: SourceKind!
  ref_id: String
  ref_type: String
  cost: SourceCost
  tags: [String!]
  owner: Creator
  enabled: Boolean!
  quarantined: Boolean!
  quarantine_draft_id: String
  last_computed_at: DateTime
  latest_value_score: Float
  latest_volume: Int
  latest_unique_contribution: Float
  latest_corroboration_rate: Float
  latest_lead_time_hours: Float
  latest_accuracy: Float
  latest_relevance: Float
  latest_impact_score: Float
  latest_noise: Float
  latest_freshness_hours: Float
  latest_cost_per_actionable: Float
  latest_community_uniqueness: Float
  # Connector (or feed technical connector) behind the source, health is owned by Integration Monitoring
  connector: Connector
  scorecard(period: SourceScorecardPeriod): SourceScorecard
  recommendationsCount(status: [SourceRecommendationStatus!]): Int!
}

enum SourcesOrdering {
  name
  source_kind
  enabled
  last_computed_at
  latest_value_score
  latest_volume
  latest_unique_contribution
  latest_corroboration_rate
  latest_lead_time_hours
  latest_accuracy
  latest_relevance
  latest_impact_score
  latest_noise
  latest_freshness_hours
  latest_cost_per_actionable
  latest_community_uniqueness
  _score
}

type SourceConnection {
  pageInfo: PageInfo!
  edges: [SourceEdge!]!
}

type SourceEdge {
  cursor: String!
  node: Source!
}

type SourceOverlapCell {
  source_a: ID!
  source_b: ID!
  shared_count: Int!
  share_a: Float!
  share_b: Float!
  jaccard: Float!
}

type SourceOverlapMatrix {
  period: SourceScorecardPeriod!
  computed_at: DateTime
  sources: [Source!]!
  cells: [SourceOverlapCell!]!
}

type CollectionGapCoveringSource {
  source_id: ID!
  source: Source
  matched_count: Int!
  share: Float!
}

# A setting the local catalog contract of a connector requires without a default value: a deployment must provide it
type ConnectorRequiredSetting {
  key: String!
  label: String!
  description: String
  type: String!
  secret: Boolean!
}

type CollectionGapRecommendedConnector {
  slug: String!
  title: String!
  short_description: String
  origin: String!
  score: Float!
  catalog_id: String
  contract_image: String
  manager_supported: Boolean!
  verified: Boolean
  deployed: Boolean!
  coverage_inferred: Boolean
  matched_object_types: [String!]!
  matched_sectors: [String!]!
  matched_regions: [String!]!
  required_settings: [ConnectorRequiredSetting!]!
}

type CollectionGap implements InternalObject & BasicObject {
  id: ID!
  entity_type: String!
  representative: Representative!
  standard_id: String!
  parent_types: [String!]!
  metrics: [Metric]
  created_at: DateTime!
  updated_at: DateTime!
  # Collection gap
  name: String!
  pir_id: ID!
  pir: Pir
  criterion_index: Int!
  criterion_filters: String!
  criterion_weight: Int!
  criterion_label: String!
  coverage_score: Int!
  is_gap: Boolean!
  matched_relationships: Int!
  recent_relationships: Int!
  distinct_sources: Int!
  covering_sources: [CollectionGapCoveringSource!]!
  object_types: [String!]!
  sectors: [String!]!
  regions: [String!]!
  recommended_connectors: [CollectionGapRecommendedConnector!]!
  hub_status: String
  computed_at: DateTime
}

enum CollectionGapsOrdering {
  name
  gap_coverage_score
  computed_at
  _score
}

type CollectionGapConnection {
  pageInfo: PageInfo!
  edges: [CollectionGapEdge!]!
}

type CollectionGapEdge {
  cursor: String!
  node: CollectionGap!
}

type SourceRecommendation implements InternalObject & BasicObject {
  id: ID!
  entity_type: String!
  representative: Representative!
  standard_id: String!
  parent_types: [String!]!
  metrics: [Metric]
  created_at: DateTime!
  updated_at: DateTime!
  # Recommendation
  name: String!
  kind: SourceRecommendationKind!
  status: SourceRecommendationStatus!
  source_id: ID
  source: Source
  rationale: String!
  payload: String!
  evidence: String
  apply_result: String
  error_message: String
  autonomous: Boolean!
  collection_gap_id: ID
  pir_id: ID
  proposed_at: DateTime!
  applied_by: Creator
  applied_at: DateTime
  reverted_by: Creator
  reverted_at: DateTime
  dismissed_by: Creator
  dismissed_at: DateTime
  dismiss_reason: String
  # Settings an add_connector recommendation needs to deploy its connector (empty for the other kinds)
  required_settings: [ConnectorRequiredSetting!]!
}

enum SourceRecommendationsOrdering {
  name
  proposed_at
  applied_at
  recommendation_kind
  recommendation_status
  _score
}

type SourceRecommendationConnection {
  pageInfo: PageInfo!
  edges: [SourceRecommendationEdge!]!
}

type SourceRecommendationEdge {
  cursor: String!
  node: SourceRecommendation!
}

type SourceIntelligenceValueWeights {
  uniqueness: Float!
  lead_time: Float!
  accuracy: Float!
  relevance: Float!
  impact: Float!
  noise: Float!
}

type SourceIntelligenceThresholds {
  min_volume: Int!
  low_accuracy: Float!
  quarantine_accuracy: Float!
  high_accuracy: Float!
  raise_confidence_corroboration: Float!
  high_noise: Float!
  deny_list_min_false_positives: Int!
  redundant_overlap: Float!
  retire_max_unique_contribution: Float!
  stale_feed_hours: Int!
  gap_coverage: Int!
}

type SourceIntelligenceTuning {
  confidence_step: Int!
  min_confidence: Int!
  noisy_decay_lifetime_days: Int!
  deny_list_max_values: Int!
  dismiss_cooldown_days: Int!
  min_schedule_minutes: Int!
}

type SourceIntelligenceAutonomy {
  auto_apply_kinds: [SourceRecommendationKind!]!
  max_auto_actions_per_run: Int!
}

type SourceIntelligenceGapSettings {
  window_days: Int!
  recent_days: Int!
  target_relationships: Int!
  target_sources: Int!
  max_recommendations: Int!
}

type SourceIntelligenceSettings {
  manager_running: Boolean!
  manager_enabled: Boolean!
  recompute_hour_utc: Int!
  backfill_days: Int!
  snapshot_retention_days: Int!
  corroboration_min_other_sources: Int!
  false_positive_labels: [String!]!
  max_scan_objects: Int!
  overlap_top: Int!
  min_author_volume: Int!
  max_author_sources: Int!
  min_manual_volume: Int!
  max_manual_sources: Int!
  value_weights: SourceIntelligenceValueWeights!
  thresholds: SourceIntelligenceThresholds!
  tuning: SourceIntelligenceTuning!
  autonomy: SourceIntelligenceAutonomy!
  gaps: SourceIntelligenceGapSettings!
}

type SourceIntelligenceStatus {
  manager_running: Boolean!
  manager_enabled: Boolean!
  enterprise_edition: Boolean!
  provenance_mode: SourceProvenanceMode!
  pulse_available: Boolean!
  hunt_available: Boolean!
  # Sources tracked, each with its scorecards refreshed at every computation
  sources_count: Int!
  # Sources whose live scorecards count at least one object
  scored_sources_count: Int!
  last_full_run_start: DateTime
  last_full_run_end: DateTime
  last_run_success: Boolean
  last_run_message: String
  last_scanned_objects: Int
  last_scan_truncated: Boolean!
  backfill_done: Boolean!
  backfill_next_day: String
  # History backfill progress, in days computed and planned
  backfill_days_done: Int
  backfill_days_total: Int
  recompute_requested_at: DateTime
}

type SourceScorecardMetric {
  key: String!
  label: String!
  type: String!
  higher_is_better: Boolean!
  enterprise: Boolean!
}

type SourceScorecardDistributionItem {
  label: String!
  value: Float
  # ISO 4217 currency of the value when the metric is a cost
  currency: String
  entity: Source
}

type SourceScorecardNumber {
  value: Float
  sources_count: Int!
  # ISO 4217 currency of the value when the metric is a cost
  currency: String
}

type SourceScorecardTimePoint {
  date: DateTime!
  value: Float
  # ISO 4217 currency of the value when the metric is a cost
  currency: String
}

type SourceScorecardScatterPoint {
  label: String!
  x: Float
  y: Float
  size: Float
  # ISO 4217 currency of the cost metrics of the point
  currency: String
  entity: Source
}

input SourceCostInput {
  amount: Float!
  currency: String! @constraint(minLength: 3, maxLength: 3)
  period: SourceCostPeriod!
}

input SourceRecommendationApplyInput {
  # Connector deployed from the catalog for an add_connector recommendation
  connector_id: ID
  # Settings of the connector an add_connector recommendation deploys, used for the deployment only and never stored
  configuration: [ContractConfigInput!]
}

input SourceIntelligenceValueWeightsInput {
  uniqueness: Float
  lead_time: Float
  accuracy: Float
  relevance: Float
  impact: Float
  noise: Float
}

input SourceIntelligenceThresholdsInput {
  min_volume: Int
  low_accuracy: Float
  quarantine_accuracy: Float
  high_accuracy: Float
  raise_confidence_corroboration: Float
  high_noise: Float
  deny_list_min_false_positives: Int
  redundant_overlap: Float
  retire_max_unique_contribution: Float
  stale_feed_hours: Int
  gap_coverage: Int
}

input SourceIntelligenceTuningInput {
  confidence_step: Int
  min_confidence: Int
  noisy_decay_lifetime_days: Int
  deny_list_max_values: Int
  dismiss_cooldown_days: Int
  min_schedule_minutes: Int
}

input SourceIntelligenceAutonomyInput {
  auto_apply_kinds: [SourceRecommendationKind!]
  max_auto_actions_per_run: Int
}

input SourceIntelligenceGapSettingsInput {
  window_days: Int
  recent_days: Int
  target_relationships: Int
  target_sources: Int
  max_recommendations: Int
}

input SourceIntelligenceSettingsInput {
  manager_running: Boolean
  recompute_hour_utc: Int
  backfill_days: Int
  snapshot_retention_days: Int
  corroboration_min_other_sources: Int
  false_positive_labels: [String!]
  max_scan_objects: Int
  overlap_top: Int
  min_author_volume: Int
  max_author_sources: Int
  min_manual_volume: Int
  max_manual_sources: Int
  value_weights: SourceIntelligenceValueWeightsInput
  thresholds: SourceIntelligenceThresholdsInput
  tuning: SourceIntelligenceTuningInput
  autonomy: SourceIntelligenceAutonomyInput
  gaps: SourceIntelligenceGapSettingsInput
}

type Query {
  sources(
    first: Int
    after: ID
    orderBy: SourcesOrdering
    orderMode: OrderingMode
    filters: FilterGroup
    search: String
  ): SourceConnection @auth(for: [MODULES, INGESTION])
  source(id: ID!): Source @auth(for: [MODULES, INGESTION])
  sourceScorecards(
    sourceId: ID!
    period: SourceScorecardPeriod
    startDate: DateTime
    endDate: DateTime
    first: Int
  ): [SourceScorecard!]! @auth(for: [MODULES, INGESTION])
  sourceOverlap(period: SourceScorecardPeriod, sourceIds: [ID!], first: Int): SourceOverlapMatrix! @auth(for: [MODULES, INGESTION])
  collectionGaps(
    pirId: ID
    onlyGaps: Boolean
    first: Int
    after: ID
    orderBy: CollectionGapsOrdering
    orderMode: OrderingMode
  ): CollectionGapConnection @auth(for: [MODULES, INGESTION])
  sourceRecommendations(
    first: Int
    after: ID
    orderBy: SourceRecommendationsOrdering
    orderMode: OrderingMode
    filters: FilterGroup
    search: String
    status: [SourceRecommendationStatus!]
    kind: [SourceRecommendationKind!]
    sourceId: ID
  ): SourceRecommendationConnection @auth(for: [MODULES, INGESTION])
  sourceRecommendation(id: ID!): SourceRecommendation @auth(for: [MODULES, INGESTION])
  sourceIntelligenceSettings: SourceIntelligenceSettings @auth(for: [MODULES, INGESTION, SETTINGS_SETCUSTOMIZATION])
  sourceIntelligenceStatus: SourceIntelligenceStatus! @auth(for: [MODULES, INGESTION])
  # Dashboard widgets of the Sources perspective
  sourceScorecardMetrics: [SourceScorecardMetric!]! @auth(for: [MODULES, INGESTION])
  sourceScorecardsDistribution(
    metric: String!
    period: SourceScorecardPeriod
    filters: FilterGroup
    first: Int
    orderMode: OrderingMode
  ): [SourceScorecardDistributionItem!]! @auth(for: [MODULES, INGESTION])
  sourceScorecardsNumber(
    metric: String!
    period: SourceScorecardPeriod
    filters: FilterGroup
    aggregation: SourceScorecardAggregation
  ): SourceScorecardNumber! @auth(for: [MODULES, INGESTION])
  sourceScorecardsTimeSeries(
    metric: String!
    period: SourceScorecardPeriod
    filters: FilterGroup
    startDate: DateTime
    endDate: DateTime
    aggregation: SourceScorecardAggregation
  ): [SourceScorecardTimePoint!]! @auth(for: [MODULES, INGESTION])
  sourceScorecardsScatter(
    xMetric: String!
    yMetric: String!
    sizeMetric: String
    period: SourceScorecardPeriod
    filters: FilterGroup
    first: Int
  ): [SourceScorecardScatterPoint!]! @auth(for: [MODULES, INGESTION])
}

type Mutation {
  sourceSetCost(id: ID!, input: SourceCostInput): Source @auth(for: [MODULES_MODMANAGE, INGESTION_SETINGESTIONS])
  sourceFieldPatch(id: ID!, input: [EditInput!]!): Source @auth(for: [MODULES_MODMANAGE, INGESTION_SETINGESTIONS])
  # Any capability one of the actions needs: the exact one is checked for each recommendation kind and target
  applySourceRecommendation(id: ID!, input: SourceRecommendationApplyInput): SourceRecommendation @auth(for: [MODULES_MODMANAGE, INGESTION_SETINGESTIONS, SETTINGS_SETACCESSES, SETTINGS_SETCUSTOMIZATION])
  revertSourceRecommendation(id: ID!): SourceRecommendation @auth(for: [MODULES_MODMANAGE, INGESTION_SETINGESTIONS, SETTINGS_SETACCESSES, SETTINGS_SETCUSTOMIZATION])
  dismissSourceRecommendation(id: ID!, reason: String): SourceRecommendation @auth(for: [MODULES_MODMANAGE, INGESTION_SETINGESTIONS])
  collectionGapDeployConnector(id: ID!, slug: String!, configuration: [ContractConfigInput!]): SourceRecommendation @auth(for: [MODULES_MODMANAGE])
  sourceIntelligenceSettingsEdit(input: SourceIntelligenceSettingsInput!): SourceIntelligenceSettings @auth(for: [SETTINGS_SETCUSTOMIZATION])
  sourceIntelligenceRecompute: Boolean @auth(for: [MODULES_MODMANAGE, INGESTION_SETINGESTIONS])
  sourceIntelligenceDashboardCreate(name: String): Workspace @auth(for: [EXPLORE_EXUPDATE])
}

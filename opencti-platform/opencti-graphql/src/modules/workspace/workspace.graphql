type Workspace implements InternalObject & BasicObject {
    id: ID!
    entity_type: String!
    representative: Representative!
    standard_id: String!
    parent_types: [String!]!
    metrics:[Metric]
    # Workspace
    type: String
    name: String!
    description: String
    owner: Creator
    tags: [String!]
    manifest: String
    created_at: DateTime
    updated_at: DateTime
    refreshed_at: DateTime
    refresh_interval: Int
    editContext: [EditUserContext!]
    investigated_entities_ids: [String]
    objects(
        first: Int
        after: ID
        orderBy: StixObjectOrStixRelationshipsOrdering
        orderMode: OrderingMode
        filters: FilterGroup
        search: String
        types: [String]
        all: Boolean
    ): StixObjectOrStixRelationshipRefConnection
    graph_data: String
    authorizedMembers: [MemberAccess!]!
    currentUserAccessRight: String
    toStixReportBundle: String
    toConfigurationExport: String!
    toWidgetExport(widgetId: ID!): String!
    isShared: Boolean
    variables: [DashboardVariable!]! @ff(flags: ["DASHBOARD_VARIABLES"], softFail: true, defaultValue: "[]")
}

# Ordering
enum WorkspacesOrdering {
    name
    created_at
    updated_at
    creator
    _score
}

# Relay connections
type WorkspaceConnection {
    pageInfo: PageInfo!
    edges: [WorkspaceEdge!]!
}

# Queries
type Query {
    workspace(id: String!): Workspace @auth(for: [EXPLORE, SETTINGS_SETACCESSES, INVESTIGATION])
    workspaces(
        first: Int
        after: ID
        orderBy: WorkspacesOrdering
        orderMode: OrderingMode
        filters: FilterGroup
        includeAuthorities: Boolean
        search: String
    ): WorkspaceConnection @auth(for: [EXPLORE, SETTINGS_SETACCESSES, INVESTIGATION])
}

type WorkspaceEdge {
    cursor: String!
    node: Workspace!
}

# Dashboard variables
enum DashboardVariableType {
    vocabulary
    killChainPhase
    entity
    entityType
    label
    user
    marking
    status
    group
    boolean
    numeric
    text
    date
}

enum DashboardVariableRestrictionMode {
    none
    selection
    filters
}

type DashboardVariableRestriction {
    mode: DashboardVariableRestrictionMode!
    values: [String!]
    filters: String
}

type DashboardVariable {
    id: ID!
    name: String!
    type: DashboardVariableType!
    vocabularyCategory: VocabularyCategory
    killChainName: String
    entityTypes: [String!]
    restriction: DashboardVariableRestriction!
    defaultValue: String
    usedInWidgetIds: [ID!]!
}

input DashboardVariableRestrictionInput {
    mode: DashboardVariableRestrictionMode!
    values: [String!]
    filters: String
}

input DashboardVariableInput {
    id: ID
    name: String!
    type: DashboardVariableType!
    vocabularyCategory: VocabularyCategory
    killChainName: String
    entityTypes: [String!]
    restriction: DashboardVariableRestrictionInput
    defaultValue: String
}

# Mutations
input WorkspaceAddInput {
    type: String!
    name: String! @constraint(minLength: 2, format: "not-blank")
    description: String
    tags: [String!]
    authorized_members: [MemberAccessInput!]
    investigated_entities_ids: [String]
    refresh_interval: Int
}

input WorkspaceDuplicateInput {
    type: String!
    name: String! @constraint(minLength: 2, format: "not-blank")
    description: String
    manifest: String
    tags: [String!]
}

input InvestigationDuplicateInput {
    id: ID!
    name: String! @constraint(minLength: 2, format: "not-blank")
}

input ImportConfigurationInput {
    importType: String!
    file: Upload!
    dashboardManifest: String
}

input ImportWidgetInput {
    file: Upload!
    dashboardManifest: String
}

type Mutation {
    workspaceAdd(input: WorkspaceAddInput!): Workspace @auth(for: [EXPLORE_EXUPDATE, INVESTIGATION_INUPDATE])
    workspaceDuplicate(input: WorkspaceDuplicateInput!): Workspace @auth(for: [EXPLORE_EXUPDATE, INVESTIGATION_INUPDATE])
    investigationDuplicate(input: InvestigationDuplicateInput!): Workspace @auth(for: [INVESTIGATION_INUPDATE])
    workspaceDelete(id: ID!): ID @auth(for: [EXPLORE_EXUPDATE_EXDELETE, INVESTIGATION_INUPDATE_INDELETE])
    workspaceFieldPatch(id: ID!, input: [EditInput!]!): Workspace @auth(for: [EXPLORE_EXUPDATE, INVESTIGATION_INUPDATE])
    workspaceEditAuthorizedMembers(id: ID!, input:[MemberAccessInput!]!): Workspace @auth(for: [EXPLORE_EXUPDATE, INVESTIGATION_INUPDATE])
    workspaceContextPatch(id: ID!, input: EditContext!): Workspace @auth(for: [EXPLORE_EXUPDATE, INVESTIGATION_INUPDATE])
    workspaceContextClean(id: ID!): Workspace @auth(for: [EXPLORE_EXUPDATE, INVESTIGATION_INUPDATE])
    workspaceConfigurationImport(file: Upload!): String! @auth(for: [EXPLORE_EXUPDATE, INVESTIGATION_INUPDATE])
    workspaceWidgetConfigurationImport(id: ID!, input: ImportConfigurationInput!): Workspace @auth(for: [EXPLORE_EXUPDATE, INVESTIGATION_INUPDATE])
    workspaceVariableUpsert(id: ID!, input: DashboardVariableInput!): Workspace @auth(for: [EXPLORE_EXUPDATE]) @ff(flags: ["DASHBOARD_VARIABLES"])
    workspaceVariableDelete(id: ID!, variableId: ID!): Workspace @auth(for: [EXPLORE_EXUPDATE]) @ff(flags: ["DASHBOARD_VARIABLES"])
}

# Subscriptions
type Subscription {
    workspace(id: ID!): Workspace @auth(for: [EXPLORE, INVESTIGATION])
}

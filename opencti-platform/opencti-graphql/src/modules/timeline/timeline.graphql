enum TimelineLane {
  adversary
  evidence
  response
  knowledge
  detection
  custom
}

enum TimelinePrecision {
  exact
  hour
  day
  approximate
}

enum TimelineEventSource {
  derived
  manual
}

enum TimelineEventKind {
  technique_used
  observed_window
  sighting
  infrastructure_seen
  malware_seen
  threat_seen
  incident_seen
  indicator_valid
  report_published
  reference_published
  file_uploaded
  case_opened
  task_created
  task_due
  task_completed
  status_changed
  assigned
  note_added
  opinion_added
  investigation_step
  object_added
  relation_created
  merged
  coverage_result
  hunt_run
  deployment
  milestone
  containment
  eradication
  recovery
  notification
}

enum TimelineGrouping {
  hour
  day
  week
}

enum TimelineZoomWindow {
  fit
  day
  week
  month
  quarter
  year
}

enum TimelineExportFormat {
  csv
  svg
  html
}

enum TimelineUpdateType {
  derived
  manual
  annotation
  settings
  anchors
}

type TimelineAnchors {
  first_adversary_activity: DateTime
  first_detection: DateTime
  first_response: DateTime
  containment: DateTime
  closure: DateTime
  computed_at: DateTime
  changed_at: DateTime
}

type TimelineEvent implements InternalObject & BasicObject {
  # BasicObject
  id: ID!
  standard_id: String!
  entity_type: String!
  parent_types: [String!]!
  metrics: [Metric]
  representative: Representative!
  created_at: DateTime!
  updated_at: DateTime!
  creators: [Creator!]
  # TimelineEvent
  container_id: String!
  event_time: DateTime!
  event_end_time: DateTime
  "Started without a known end (a run still running, a deployment still active): the window stays open"
  open_ended: Boolean
  precision: TimelinePrecision!
  lane: TimelineLane!
  kind: TimelineEventKind!
  title: String!
  description: String
  source: TimelineEventSource!
  rule_id: String
  element_id: String
  element_type: String
  element: StixObjectOrStixRelationship
  pinned: Boolean!
  hidden: Boolean!
  annotation: String
  confidence: Int
  ordering_hint: Int
  external_id: String
  analyst_fields: [String!]!
  source_state: TimelineSourceState
  createdBy: Identity
  objectMarking: [MarkingDefinition!]
  "Whether the current user can edit and delete the event: a manual event of a container the user can update, outside drafts, within the confidence level of the user (derived events can only be pinned, hidden and annotated)"
  editable: Boolean!
  "Whether the current user can pin, hide and annotate the event: a container the user can update, outside drafts, and an event within the confidence level of the user"
  annotatable: Boolean!
}

type TimelineEventEdge {
  cursor: String!
  node: TimelineEvent!
}

type TimelineEventConnection {
  pageInfo: PageInfo!
  edges: [TimelineEventEdge!]!
}

type TimelineSettings implements InternalObject & BasicObject {
  # BasicObject
  id: ID!
  standard_id: String!
  entity_type: String!
  parent_types: [String!]!
  metrics: [Metric]
  representative: Representative!
  # TimelineSettings
  container_id: String!
  enabled_lanes: [TimelineLane!]!
  default_grouping: TimelineGrouping!
  default_zoom_window: TimelineZoomWindow!
  hidden_kinds: [TimelineEventKind!]!
}

type TimelineLaneDistribution {
  lane: TimelineLane!
  count: Int!
}

type TimelineKindDistribution {
  kind: TimelineEventKind!
  count: Int!
}

type TimelineSummary {
  container_id: String!
  "Number of events the current user can see"
  total: Int!
  manual_count: Int!
  pinned_count: Int!
  hidden_count: Int!
  first_event_time: DateTime
  last_event_time: DateTime
  lanes: [TimelineLaneDistribution!]!
  kinds: [TimelineKindDistribution!]!
  anchors: TimelineAnchors
  settings: TimelineSettings!
  "Whether the current user can add milestones, annotate events and change the settings"
  can_edit: Boolean!
  "True when the derivation of this container reached one of its bounds (objects, history, events)"
  truncated: Boolean!
  generated_at: DateTime
}

type TimelineBounds {
  "Earliest start of the matching events"
  first_event_time: DateTime
  "Latest start or end of the matching events, whichever is later"
  last_event_time: DateTime
}

type TimelineRegenerationResult {
  container_id: String!
  derived_count: Int!
  manual_count: Int!
  created_count: Int!
  updated_count: Int!
  deleted_count: Int!
  truncated: Boolean!
  duration_ms: Int!
  anchors: TimelineAnchors
}

type TimelineUpdate {
  container_id: String!
  update_type: TimelineUpdateType!
  changed_event_ids: [String!]!
  updated_at: DateTime!
  anchors: TimelineAnchors
}

type TimelineRuleDefinition {
  id: String!
  label: String!
  kinds: [TimelineEventKind!]!
  "False for soft-check rules whose source type is not registered on this platform"
  available: Boolean!
}

input TimelineEventAddInput {
  container_id: String!
  event_time: DateTime!
  event_end_time: DateTime
  precision: TimelinePrecision
  lane: TimelineLane
  kind: TimelineEventKind
  title: String! @constraint(minLength: 1, maxLength: 512, format: "not-blank")
  description: String @constraint(maxLength: 10000)
  element_id: String
  confidence: Int @constraint(min: 0, max: 100)
  ordering_hint: Int
  annotation: String @constraint(maxLength: 10000)
  pinned: Boolean
  createdBy: String
  objectMarking: [String!]
  "Idempotency key: adding twice an event with the same external id on the same container updates it"
  external_id: String @constraint(maxLength: 256)
}

input TimelineEventEditInput {
  event_time: DateTime
  event_end_time: DateTime
  clear_event_end_time: Boolean
  precision: TimelinePrecision
  lane: TimelineLane
  kind: TimelineEventKind
  title: String @constraint(minLength: 1, maxLength: 512, format: "not-blank")
  description: String @constraint(maxLength: 10000)
  element_id: String
  confidence: Int @constraint(min: 0, max: 100)
  ordering_hint: Int
  annotation: String @constraint(maxLength: 10000)
  createdBy: String
  objectMarking: [String!]
}

"Translated label of an export (title, lane.<lane>, kind.<kind>, anchor.<anchor>, column.<column>, ...)"
input TimelineExportLabelInput {
  key: String! @constraint(maxLength: 128)
  label: String! @constraint(maxLength: 256)
}

"State of the run, step or deployment a derived event comes from, as its owner stores it (labelled with the owner's vocabulary)"
type TimelineSourceState {
  family: String!
  state: String
  verdict: String
  validation: String
  run_id: String
  step: String
}

type TimelineExportFile {
  content: String!
  "Never weaker than the markings of the exported events and of the elements they reference (highest marking per definition type)"
  file_markings: [MarkingDefinition!]!
}

input TimelineSettingsInput {
  enabled_lanes: [TimelineLane!]
  default_grouping: TimelineGrouping
  default_zoom_window: TimelineZoomWindow
  hidden_kinds: [TimelineEventKind!]
}

# Containers carrying a timeline expose their anchors
extend type Incident {
  x_opencti_timeline_anchors: TimelineAnchors
}
extend type CaseIncident {
  x_opencti_timeline_anchors: TimelineAnchors
}
extend type CaseRfi {
  x_opencti_timeline_anchors: TimelineAnchors
}
extend type CaseRft {
  x_opencti_timeline_anchors: TimelineAnchors
}

# Anchors are sortable on the lists of the timeline containers
extend enum IncidentsOrdering {
  timeline_first_adversary_activity
  timeline_first_detection
  timeline_first_response
  timeline_containment
  timeline_closure
  timeline_computed_at
  timeline_changed_at
}
extend enum CaseIncidentsOrdering {
  timeline_first_adversary_activity
  timeline_first_detection
  timeline_first_response
  timeline_containment
  timeline_closure
  timeline_computed_at
  timeline_changed_at
}
extend enum CaseRfisOrdering {
  timeline_first_adversary_activity
  timeline_first_detection
  timeline_first_response
  timeline_containment
  timeline_closure
  timeline_computed_at
  timeline_changed_at
}
extend enum CaseRftsOrdering {
  timeline_first_adversary_activity
  timeline_first_detection
  timeline_first_response
  timeline_containment
  timeline_closure
  timeline_computed_at
  timeline_changed_at
}

# Trigger event types fed by the timeline (Community Edition triggers and digests)
extend enum TriggerEventType {
  timeline_anchor_changed
  timeline_milestone_added
}

type Query {
  containerTimeline(
    id: String!
    from: DateTime
    to: DateTime
    lanes: [TimelineLane!]
    kinds: [TimelineEventKind!]
    sources: [TimelineEventSource!]
    markings: [String!]
    search: String
    includeHidden: Boolean
    pinnedOnly: Boolean
    "Ascending (default) from the oldest event, descending from the latest one"
    orderMode: OrderingMode
    first: Int
    after: ID
  ): TimelineEventConnection @auth(for: [KNOWLEDGE])
  "Bounds of every event matching the filters, also the ones not loaded yet by the paginated list"
  containerTimelineBounds(
    id: String!
    lanes: [TimelineLane!]
    kinds: [TimelineEventKind!]
    sources: [TimelineEventSource!]
    markings: [String!]
    search: String
    includeHidden: Boolean
    pinnedOnly: Boolean
  ): TimelineBounds @auth(for: [KNOWLEDGE])
  containerTimelineSummary(
    id: String!
    "Counts and bounds restricted to these lanes (all when empty)"
    lanes: [TimelineLane!]
    "Counts and bounds restricted to these kinds (all when empty)"
    kinds: [TimelineEventKind!]
  ): TimelineSummary @auth(for: [KNOWLEDGE])
  containerTimelineExport(
    id: String!
    format: TimelineExportFormat!
    from: DateTime
    to: DateTime
    lanes: [TimelineLane!]
    kinds: [TimelineEventKind!]
    sources: [TimelineEventSource!]
    markings: [String!]
    search: String
    includeHidden: Boolean
    pinnedOnly: Boolean
    labels: [TimelineExportLabelInput!]
    "Content ceiling: events marked above these markings (or above the max shareable markings of the user) are left out"
    contentMaxMarkings: [String!]
  ): String @auth(for: [KNOWLEDGE])
  "Timeline export stored as a file: the content and the file markings covering it, computed from the same events"
  containerTimelineExportFile(
    id: String!
    format: TimelineExportFormat!
    from: DateTime
    to: DateTime
    lanes: [TimelineLane!]
    kinds: [TimelineEventKind!]
    sources: [TimelineEventSource!]
    markings: [String!]
    search: String
    includeHidden: Boolean
    pinnedOnly: Boolean
    labels: [TimelineExportLabelInput!]
    contentMaxMarkings: [String!]
    "Markings selected for the file, raised to cover the markings of the exported events and of the elements they reference"
    fileMarkings: [String!]
  ): TimelineExportFile @auth(for: [KNOWLEDGE])
  timelineEvent(id: String!): TimelineEvent @auth(for: [KNOWLEDGE])
  timelineAnchors(containerId: String!): TimelineAnchors @auth(for: [KNOWLEDGE])
  timelineRules: [TimelineRuleDefinition!]! @auth(for: [KNOWLEDGE])
}

type Mutation {
  timelineEventAdd(input: TimelineEventAddInput!): TimelineEvent @auth(for: [KNOWLEDGE_KNUPDATE])
  timelineEventEdit(id: ID!, input: TimelineEventEditInput!): TimelineEvent @auth(for: [KNOWLEDGE_KNUPDATE])
  timelineEventDelete(id: ID!): ID @auth(for: [KNOWLEDGE_KNUPDATE])
  timelineEventPin(id: ID!, pinned: Boolean!): TimelineEvent @auth(for: [KNOWLEDGE_KNUPDATE])
  timelineEventHide(id: ID!, hidden: Boolean!): TimelineEvent @auth(for: [KNOWLEDGE_KNUPDATE])
  timelineSettingsUpdate(containerId: ID!, input: TimelineSettingsInput!): TimelineSettings @auth(for: [KNOWLEDGE_KNUPDATE])
  timelineRegenerate(containerId: ID!): TimelineRegenerationResult @auth(for: [KNOWLEDGE_KNUPDATE])
  "Import the analyst contributions carried by the timeline STIX extension of a container (used by the worker)"
  timelineImport(containerId: ID!, extension: String!): TimelineRegenerationResult @auth(for: [KNOWLEDGE_KNUPDATE])
  "Record that the Timeline tab of a container was opened (usage telemetry, no data change)"
  timelineViewed(containerId: ID!): Boolean @auth(for: [KNOWLEDGE])
}

type Subscription {
  containerTimelineUpdated(id: ID!): TimelineUpdate @auth(for: [KNOWLEDGE])
}

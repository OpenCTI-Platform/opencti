enum NewsFeedItemsOrdering {
  title
  news_feed_type
  creation_date
}

type NewsFeedItemMetadata {
  key: String!
  value: String
}

type NewsFeedItem implements InternalObject & BasicObject {
  id: ID!
  standard_id: String!
  entity_type: String!
  representative: Representative!
  parent_types: [String!]!
  metrics: [Metric]

  title: String!
  news_feed_type: String!
  tags: [String!]!
  metadata: [NewsFeedItemMetadata!]!
  creation_date: DateTime!
  is_read: Boolean!
  user_id: String!
}

type NewsFeedItemConnection {
  pageInfo: PageInfo!
  edges: [NewsFeedItemEdge!]!
}

type NewsFeedItemEdge {
  cursor: String!
  node: NewsFeedItem!
}

enum NewsFeedCategory {
  BLOG_POST
  RESOURCE
}

type NewsFeedCount {
  user_id: String
  count: Int
  blog_post_count: Int
  resource_count: Int
}

type Query {
  myNewsFeeds(
    first: Int
    after: ID
    orderBy: NewsFeedItemsOrdering
    orderMode: OrderingMode
    filters: FilterGroup
    search: String
  ): NewsFeedItemConnection @auth
  myUnreadNewsFeedsCount(category: NewsFeedCategory): Int @auth
}

type Mutation {
  markAllNewsFeedItemsAsRead(category: NewsFeedCategory): Boolean @auth
}

type Subscription {
  newsFeedItemAdded: NewsFeedItem @auth
  newsFeedItem: NewsFeedItem @auth
  newsFeedItemDeleted: ID @auth
  newsFeedsNumber: NewsFeedCount @auth
}

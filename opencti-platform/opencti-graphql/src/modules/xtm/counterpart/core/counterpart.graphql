# The kinds of object OpenCTI and the other XTM products both hold, each matched on its natural key:
# ASSET: System, Hostname, IPv4/IPv6-Addr, by the hostname of an OpenAEV asset
# ATTACK_PATTERN: Attack-Pattern, by its MITRE id (x_mitre_id)
# VULNERABILITY: Vulnerability, by its CVE id
# THREAT: Report, Threat actor, Intrusion set, Malware, Campaign, by the STIX id an OpenAEV scenario was generated from
# ALERT: Incident, Sighting, by an external reference URL equal to the link of an alert an OpenAEV collector matched
enum XtmCounterpartKind {
  ASSET
  ATTACK_PATTERN
  VULNERABILITY
  THREAT
  ALERT
}

# Whether another XTM product is connected to this platform. Never carries a credential or an address.
type XtmConnection {
  product: String!
  connected: Boolean!
}

# One key fact of a counterpart: a stable key (findings, affected_assets, simulations, last_simulation) and its value as text.
type XtmCounterpartFact {
  key: String!
  value: String!
}

# An object of a connected XTM product matching one key of this platform.
type XtmCounterpart {
  key: String!
  product: String!
  object_id: String!
  object_type: String!
  object_name: String
  object_url: String!
  facts: [XtmCounterpartFact!]!
}

# found: the product holds the object (counterpart set); not_found: it does not;
# not_supported: the product has no such lookup (draw nothing); unavailable: it could not answer this time.
enum XtmCounterpartStatus {
  found
  not_found
  not_supported
  unavailable
}

# The answer for one object of this platform in one connected product. The product answers under
# the calling user's own rights: facts only when that user has rights there.
type XtmCounterpartResult {
  id: String!
  product: String!
  status: XtmCounterpartStatus!
  counterpart: XtmCounterpart
}

type Query {
  xtmConnections: [XtmConnection!]! @auth
  # Former key-based lookup, removed once the front reads xtmCounterpartsOf.
  xtmCounterparts(kind: XtmCounterpartKind!, keys: [String!]!): [XtmCounterpart!]! @auth(for: [KNOWLEDGE])
  # The counterparts of objects of this platform given by id; keys are read on the server. An id the
  # caller cannot read, or whose object has no key, gets no entry.
  xtmCounterpartsOf(ids: [String!]!): [XtmCounterpartResult!]! @auth(for: [KNOWLEDGE])
}

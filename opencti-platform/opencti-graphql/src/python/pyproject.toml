[project]
name = "opencti-platform-python"
version = "0.0.0"
description = "Python runtime of the OpenCTI platform (indicator pattern checks and generation)."
requires-python = ">=3.10"
# never published on PyPI: PyPI rejects this classifier
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  # pycti of the same commit, provided by the uv workspace
  "pycti",
  "parsuricata==0.4.1",
  "yara-python==4.5.4",
  "pysigma==1.5.0",
  "jsonpatch==1.33",
  "eql==0.9.19",
  # Fix transitive dependencies from pycti ranges
  "starlette==1.3.1",
]

[tool.uv]
# scripts run directly by the platform, nothing to build or install
package = false

[tool.uv.sources]
pycti = { workspace = true }

[tool.isort]
profile = "black"

[tool.pylint.FORMAT]
max-line-length = 88

[tool.pylint."MESSAGE_CONTROL"]
disable = [
    "invalid-name",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
]

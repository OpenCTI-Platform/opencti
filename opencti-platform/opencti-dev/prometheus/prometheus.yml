global:
  scrape_interval: "15s"

scrape_configs:
  - job_name: 'opencti-dev-telemetry-prometheus'
    static_configs:
      - targets: ['host.docker.internal:14269']
        labels:
          app: "opencti"
  - job_name: "rabbitmq"
    metrics_path: "/metrics/detailed"
    params:
      family: ["queue_coarse_metrics", "queue_metrics"]
    static_configs:
      - targets: ["host.docker.internal:15692"]
        labels:
          app: 'opencti'
  # Per-queue counters (e.g. acked messages) have no "detailed" variant: they are
  # only exposed per queue by the per-object endpoint. It returns every metric for
  # every queue, so only keep the ones we use.
  - job_name: "rabbitmq-per-object"
    metrics_path: "/metrics/per-object"
    static_configs:
      - targets: ["host.docker.internal:15692"]
        labels:
          app: "opencti"
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "rabbitmq_queue_messages_acked_total"
        action: keep
  # Connectors expose metrics on 9095 by default: to run several of them locally,
  # give each one its own CONNECTOR_METRICS_PORT within this range.
  - job_name: "connectors"
    static_configs:
      - targets:
          - "host.docker.internal:9095"
          - "host.docker.internal:9096"
          - "host.docker.internal:9097"
          - "host.docker.internal:9098"
          - "host.docker.internal:9099"
        labels:
          app: "opencti"

rule_files:
  - "/etc/prometheus/rules/*.yml"

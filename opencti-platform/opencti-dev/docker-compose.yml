services:
  opencti-dev-redis:
    container_name: opencti-dev-redis
    image: redis:8.6.8@sha256:69e1dec6badbf924c21dc6c81a7bac6cfd1709aef032228f39aed9e34596ef45
    restart: unless-stopped
    ports:
      - 6379:6379
  opencti-dev-redis-insight:
    container_name: opencti-dev-redis-insight
    image: redislabs/redisinsight:3.8.0@sha256:b5e19ee240abef6edb435871b90ff8a210995422e8e018ab61c0339d318a1f84
    restart: unless-stopped
    ports:
      - 8001:8001
      - 5540:5540
  opencti-dev-elasticsearch:
    container_name: opencti-dev-elasticsearch
    image: elasticsearch:8.19.23@sha256:3f4d63c59ca5a05b535179dfcced47a514119e351fa81653f69902beacae90c9
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - essnapshots:/usr/share/elasticsearch/snapshots
    environment:
      - discovery.type=single-node
      - xpack.ml.enabled=false
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms2G -Xmx2G"
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - 9200:9200
      - 9300:9300
  opencti-dev-kibana:
    container_name: opencti-dev-kibana
    image: kibana:8.19.23@sha256:f82f2ee9f2979dbfe315a81f08c9dcb5ff83856d990b90a1b07f6014325bfd3f
    environment:
      - ELASTICSEARCH_HOSTS=http://opencti-dev-elasticsearch:9200
    restart: unless-stopped
    ports:
      - 5601:5601
    depends_on:
      - opencti-dev-elasticsearch
  opencti-dev-smtp:
    container_name: opencti-dev-smtp
    image: maildev/maildev:3.0.0@sha256:6e09695961f4aef9016a390ad391314a078220216601b15a35d389a7df2a3855
    restart: unless-stopped
    ports:
      - 1025:1025
      - 1080:1080

  # Disabled by default, to run use:
  # podman compose --profile opensearch up -d
  # in opencti configuration:
  # "elasticsearch": {
  #     "url": "http://localhost:9201",
  #     "username": "admin",
  #     "password": "GraceH00per!"
  opencti-dev-opensearch:
    profiles: [opensearch]
    container_name: opencti-dev-opensearch
    build: ./opensearch
    volumes:
      - osdata:/usr/share/opensearch/data
      - ossnapshots:/usr/share/opensearch/snapshots
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms2G -Xmx2G
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=GraceH00per! # minimum 8 character password and must contain at least one uppercase letter, one lowercase letter, one digit, and one special character that is strong.
    ulimits:
      memlock:
        soft: -1 # Set memlock to unlimited (no soft or hard limit)
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536
    ports:
      - 9201:9200
      - 9600:9600
  opencti-dev-opensearch-dashboards:
    profiles: [opensearch]
    image: opensearchproject/opensearch-dashboards:3.7.0@sha256:1c9e0a50472123bd2cde615ffb7157ef436db794e082dba09e42c3a6d3ce91a3
    container_name: opencti-dev-opensearch-dashboards
    ports:
      - 5602:5601 # Map host port 5601 to container port 5601
    expose:
      - 5602 # Expose port 5601 for web access to OpenSearch Dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opencti-dev-opensearch:9200"]' # Define the OpenSearch nodes that OpenSearch Dashboards will query
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"

  opencti-dev-minio:
    container_name: opencti-dev-minio
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ChangeMe
      MINIO_ROOT_PASSWORD: ChangeMe
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
  opencti-dev-rabbitmq:
    container_name: opencti-dev-rabbitmq
    image: rabbitmq:4.3.6-management@sha256:54cb013d76cd1fd6c0a0708f34062ad61c452bb6f016b434c6c33f1a765d2b58
    restart: unless-stopped
    volumes:
      - ./rabbitmq.config:/etc/rabbitmq/conf.d/90-userdefined.conf
    ports:
      - 5672:5672
      - 15672:15672

  ## Telemetry + tracing dependencies
  ## podman compose --profile telemetry up -d (launch everything + telemetry)
  opencti-dev-telemetry-pyroscope:
    container_name: opencti-dev-telemetry-pyroscope
    image: grafana/pyroscope:2.4.1@sha256:8ade8d37ac58c20aca0054360fbcdef956a8242f48ad68e0ec67757f21d48e28
    restart: unless-stopped
    ports:
      - "4040:4040"
    profiles:
      - "telemetry"
  opencti-dev-telemetry-jaegertracing:
    container_name: opencti-dev-telemetry-jaegertracing
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
    profiles:
      - "telemetry"
  opencti-dev-telemetry-otlp:
    container_name: opencti-dev-telemetry-otlp
    image: otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    restart: unless-stopped
    volumes:
      - "./otlp-config.yaml:/etc/config/otlp-config.yaml"
    command:
      - '--config=/etc/config/otlp-config.yaml'
    ports:
      - "1110:1110"
      - "8889:8889"
    profiles:
      - "telemetry"
  opencti-dev-telemetry-prometheus:
    container_name: opencti-dev-telemetry-prometheus
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    profiles:
      - "telemetry"
  opencti-dev-telemetry-grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: opencti-dev-telemetry-grafana
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - opencti-dev-telemetry-prometheus
    profiles:
      - "telemetry"

  # SAML / OpenId provider with keycloak - disabled by default
  # docker compose --profile keycloak up -d
  opencti-dev-keycloak:
    profiles: [keycloak]
    image: keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    volumes:
      - keycloakdata:/opt/keycloak/data
      - ./keycloak-configuration:/opt/keycloak/data/import
    container_name: opencti-dev-keycloak
    command: start-dev --import-realm --verbose
    # use below command to export a configuration. Remember to remove admin user.
    #command: export --dir /opt/keycloak/data/import/export --users same_file
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
    ports:
      - "9999:8080"

  opencti-dev-mokapi:
    image: mokapi/mokapi:0.53.0@sha256:52a16a7de1161049fcc7b3918c265c3ad1f791a4b975874714201e307dced779
    profiles: [mokapi]
    container_name: opencti-dev-mokapi
    command: mokapi --providers.file.directory=/share
    volumes:
      - "./mock-api:/share"
    ports:
      - "8090:80"
      - "1389:389"
      - "9080:8080"

volumes:
  esdata:
    driver: local
  essnapshots:
    driver: local
  osdata:
    driver: local
  ossnapshots:
    driver: local
  keycloakdata:
    driver: local

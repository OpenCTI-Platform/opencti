coverage:
  status:
    project:
      default:
        target: auto
        # Coverage may drop by up to 0.5 point versus the base commit, to absorb noise from non-deterministic test runs
        threshold: 0.5%
        informational: true
      # Informational, as in every other Filigran repository: patch coverage is the merge gate
      opencti-graphql-mandatory:
        target: auto
        threshold: 0.5%
        informational: true
        paths:
          - opencti-platform/opencti-graphql/src
          # Background workers, streams and raw HTTP routes are hard to reach from API tests
          - "!opencti-platform/opencti-graphql/src/connector/"
          - "!opencti-platform/opencti-graphql/src/graphql/"
          - "!opencti-platform/opencti-graphql/src/http/"
          - "!opencti-platform/opencti-graphql/src/lock/"
          - "!opencti-platform/opencti-graphql/src/rules/"
    patch:
      default:
        target: 80%
        informational: true
      opencti-front:
        target: 80%
        informational: true
        flags:
          - opencti-front
      opencti-graphql-mandatory:
        target: 80%
        informational: false
        paths:
          - opencti-platform/opencti-graphql/src
          - "!opencti-platform/opencti-graphql/src/connector/"
          - "!opencti-platform/opencti-graphql/src/graphql/"
          - "!opencti-platform/opencti-graphql/src/http/"
          - "!opencti-platform/opencti-graphql/src/lock/"
          - "!opencti-platform/opencti-graphql/src/rules/"
      opencti-graphql-info:
        target: 80%
        informational: true
        paths:
          - opencti-platform
      client-python:
        target: 80%
        informational: false
        paths:
          - client-python
          - "!client-python/pycti/connector/"

# A job that has not uploaded keeps the coverage of the parent commit.
flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: opencti-graphql-unit
      carryforward: true
      paths:
        - opencti-platform/opencti-graphql/
    - name: opencti-graphql-integration
      carryforward: true
      paths:
        - opencti-platform/opencti-graphql/
    - name: opencti-graphql-rules
      carryforward: true
      paths:
        - opencti-platform/opencti-graphql/
    - name: opencti-front
      carryforward: true
      paths:
        - opencti-platform/opencti-front/
    - name: opencti-client-python
      carryforward: true
      paths:
        - client-python/

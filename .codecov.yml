coverage:
  status:
    project:
      default:
        target: auto
        # Coverage may drop by up to 0.5 point versus the base commit, to absorb noise from non-deterministic test runs
        threshold: 0.5%
        informational: true
      opencti-graphql-mandatory:
        target: auto
        threshold: 0.5%
        informational: false
        paths:
          - opencti-platform/opencti-graphql/src
          # Background workers, streams and raw HTTP routes are hard to reach from API tests
          - "!opencti-platform/opencti-graphql/src/connector/"
          - "!opencti-platform/opencti-graphql/src/graphql/"
          - "!opencti-platform/opencti-graphql/src/http/"
          - "!opencti-platform/opencti-graphql/src/lock/"
          - "!opencti-platform/opencti-graphql/src/rules/"
    patch:
      default:
        target: 80%
        informational: true
      opencti-front:
        target: 80%
        informational: true
        flags:
          - opencti-front
      opencti-graphql-mandatory:
        target: 80%
        informational: false
        paths:
          - opencti-platform/opencti-graphql/src
          - "!opencti-platform/opencti-graphql/src/connector/"
          - "!opencti-platform/opencti-graphql/src/graphql/"
          - "!opencti-platform/opencti-graphql/src/http/"
          - "!opencti-platform/opencti-graphql/src/lock/"
          - "!opencti-platform/opencti-graphql/src/rules/"
      opencti-graphql-info:
        target: 80%
        informational: true
        paths:
          - opencti-platform
      client-python:
        target: 70%
        informational: false
        paths:
          - client-python
          - "!client-python/pycti/connector/"

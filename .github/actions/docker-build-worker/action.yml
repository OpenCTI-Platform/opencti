name: docker-build-worker
description: Build the opencti:worker docker image and store in local github artefact

inputs:
  image_tag:
    description: "Image Tag"
    default: ${{ github.sha }}
  checkout_ref:
    description: "Reference of the branch or commit sha"
    default: ${{ github.sha }}
  client_python_local:
    description: "Use client python from the same commit"
    required: false
    default: "false"
  docker_image_suffix:
    description: "Dockerfile image suffix such as _ubi9 or _fips or empty string"
    default: ""
  revision:
    description: "Commit sha set as org.opencontainers.image.revision label. Empty to use the workflow commit."
    required: false
    default: ""
  platform:
    description: "Single target platform such as linux/arm64. Empty to build for the runner platform."
    required: false
    default: ""
  artifact_suffix:
    description: "Suffix appended to the artifact and archive names, such as -amd64"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout_ref }}

    - name: Use client-python in worker from same branch
      shell: bash
      if: ${{ inputs.client_python_local == 'true' }}
      env:
        CHECKOUT_REF: ${{ inputs.checkout_ref }}
      run: sed -i 's|^pycti==.*$|pycti @ git+https://github.com/OpenCTI-Platform/opencti@'"$CHECKOUT_REF"'#subdirectory=client-python|' -i ./opencti-worker/requirements.txt

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        name: gha-builder-worker

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 #v6.2.0
      with:
        images: filigran/worker
        tags: type=raw,value=${{ inputs.image_tag }}
        labels: ${{ inputs.revision != '' && format('org.opencontainers.image.revision={0}', inputs.revision) || '' }}

    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: opencti-worker/Dockerfile${{ inputs.docker_image_suffix }}
        push: 'false'
        platforms: ${{ inputs.platform }}
        outputs: type=docker,dest=/tmp/opencti-worker${{ inputs.docker_image_suffix }}${{ inputs.artifact_suffix }}.tar
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Upload worker docker image artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: docker-image-opencti-worker${{ inputs.docker_image_suffix }}${{ inputs.artifact_suffix }}
        path: /tmp/opencti-worker${{ inputs.docker_image_suffix }}${{ inputs.artifact_suffix }}.tar
        retention-days: 10
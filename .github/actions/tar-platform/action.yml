name: build-platform-tar
description: Build the opencti platform and produce a tar.gz artifact

inputs:
  checkout_ref:
    description: "Reference of the branch or commit sha"
    default: ${{ github.sha }}
  tag_version:
    description: "Value of TAG_VERSION for the backend build (release tag, used to fetch the connectors manifest of the tag). Empty for rolling builds."
    required: false
    default: ""
  connectors_ref:
    description: "Branch or tag of OpenCTI-Platform/connectors to pack in the tarball"
    required: false
    default: "master"
  include_docker:
    description: "Pack OpenCTI-Platform/docker (master) in the tarball. Release tarballs do not include it."
    required: false
    default: "true"
  archive_name:
    description: "File name of the produced tar.gz"
    required: false
    default: "opencti.tar.gz"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout_ref }}

    - name: Build platform and package tar.gz
      shell: bash
      env:
        TAG_VERSION: ${{ inputs.tag_version }}
      run: |
        # Only pass TAG_VERSION when set, so rolling builds keep fetching the rolling connectors manifest
        DOCKER_ENV=()
        if [ -n "${TAG_VERSION}" ]; then
          DOCKER_ENV+=(-e "TAG_VERSION=${TAG_VERSION}")
        fi
        docker run --rm \
          "${DOCKER_ENV[@]}" \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          nikolaik/python-nodejs:python3.11-nodejs22 \
          sh -c '
            apt-get update && apt-get install -y --no-install-recommends build-essential libffi-dev curl g++ make python3 python3-dev && rm -rf /var/lib/apt/lists/* &&
            npm install -g node-gyp &&
            cd /workspace &&
            YARN_ENABLE_IMMUTABLE_INSTALLS=true yarn workspaces focus opencti-graphql opencti-front &&
            cd opencti-platform/opencti-graphql &&
            yarn build:prod &&
            cd ../opencti-front &&
            yarn build
          '

    - name: Package tar.gz
      shell: bash
      env:
        CONNECTORS_REF: ${{ inputs.connectors_ref }}
        INCLUDE_DOCKER: ${{ inputs.include_docker }}
        ARCHIVE_NAME: ${{ inputs.archive_name }}
      run: |
        set -eux
        mkdir -p release
        ls -lart
        rm -rf ./opencti-platform/opencti-graphql/.yarn/cache
        mkdir -p release/opencti/opencti-platform
        cp -a ./package.json ./yarn.lock ./.yarnrc.yml ./patch ./pyproject.toml ./uv.lock release/opencti/
        cp -a ./opencti-platform/opencti-graphql release/opencti/opencti-platform/
        # The backend serves the UI from public/ in production, as in the Dockerfile
        cp -a ./opencti-platform/opencti-front/dist release/opencti/opencti-platform/opencti-graphql/public
        # uv workspace members: pycti, the worker and the platform Python runtime (inside opencti-graphql)
        mkdir -p release/opencti/client-python release/opencti/opencti-worker
        cp -a ./client-python/pyproject.toml ./client-python/README.md ./client-python/pycti release/opencti/client-python/
        cp -a ./opencti-worker/pyproject.toml ./opencti-worker/config.yml.sample ./opencti-worker/src release/opencti/opencti-worker/
        if [ "${INCLUDE_DOCKER}" == "true" ]; then
          git clone --depth 1 --single-branch --branch master https://github.com/OpenCTI-Platform/docker release/opencti/docker
        fi
        git clone --depth 1 --single-branch --branch "${CONNECTORS_REF}" https://github.com/OpenCTI-Platform/connectors release/opencti/connectors
        ls -lart release
        pwd
        ls -lart
        cd release && tar -zcvf "/tmp/${ARCHIVE_NAME}" opencti

    - name: Upload tar artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tar-opencti-platform
        path: /tmp/${{ inputs.archive_name }}
        retention-days: 10

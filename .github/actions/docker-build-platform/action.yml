name: docker-build-platform
description: Build the opencti:platform docker image and store in local github artefact

inputs:
  image_tag:
    description: "Image Tag"
    default: ${{ github.sha }}
  checkout_ref:
    description: "Reference of the branch or commit sha"
    default: ${{ github.sha }}
  docker_image_suffix:
    description: "Dockerfile image suffix such as _ubi9 or _fips"
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout_ref }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      with:
        name: gha-builder-platform

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 #v6.2.0
      with:
        images: filigran/platform
        tags: type=raw,value=${{ inputs.image_tag }}


    - name: Build (platform)
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a #v7.3.0
      with:
        context: .
        file: opencti-platform/Dockerfile${{ inputs.docker_image_suffix }}
        push: 'false'
        outputs: type=docker,dest=/tmp/opencti-platform${{ inputs.docker_image_suffix }}.tar
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Upload platform docker image artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: docker-image-opencti-platform${{ inputs.docker_image_suffix }}
        path: /tmp/opencti-platform${{ inputs.docker_image_suffix }}.tar
        retention-days: 1
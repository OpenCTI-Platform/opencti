name: Run OpenCTI backend tests

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Reference of the branch or commit sha"
        type: string
        default: ${{ github.sha }}
      run-id:
        required: true
        type: string
      elasticsearch_versions:
        description: "Elasticsearch majors the integration and rules tests run against, as a JSON array"
        type: string
        required: false
        default: '["8"]'
    secrets:
      CODECOV_TOKEN:
        description: "Token used to upload coverage reports to Codecov"
        required: false

jobs:
  run-opencti-integration-test:
    name: Integration tests (Elasticsearch ${{ matrix.elasticsearch }})
    runs-on: ubuntu-26.04
    strategy:
      # A failure on one Elasticsearch major must not cancel the run on the other
      fail-fast: false
      matrix:
        elasticsearch: ${{ fromJSON(inputs.elasticsearch_versions) }}

    steps:
    - name: OpenCTI checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout_ref }}

    - name: Runner information
      continue-on-error: true
      run: ./scripts/ci/runner-info.sh # Display runner info and start resource monitoring in background

    - name: Fetch EE license
      run: |
        echo "EE_LICENSE=$(wget -qO- https://filigran.jfrog.io/artifactory/ci-utils/opencti-license/opencti_ee_ci_licence.crt | tr -d '\n')" >> "$GITHUB_ENV"

    - name: Download image platform
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: docker-image-opencti-platform
        path: /tmp

    - name: Download image builder
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: docker-image-opencti-builder
        path: /tmp

    - name: Download image worker
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: docker-image-opencti-worker
        path: /tmp

    - name: Load image
      run: |
          set -eux
          docker load --input /tmp/opencti-platform.tar   
          docker load --input /tmp/opencti-builder.tar   
          docker load --input /tmp/opencti-worker.tar   
          docker images

    - name: Set up Docker Compose for backends and sync instances
      env:
        # Empty for Elasticsearch 8: docker-compose.yml then keeps its default image
        ELASTICSEARCH_IMAGE: ${{ matrix.elasticsearch == '9' && 'elasticsearch:9.5.5' || '' }}
      run: |
         set -ex
         cd scripts/ci
         export TAG=${{ github.sha }}
         printf "\nAPP__ENTERPRISE_EDITION_LICENSE=\"%s\"" "$EE_LICENSE" >> ci-common.env
         docker network create runner-docker-network
         docker compose  --profile "backend" --profile "ci-test-api-sync" up -d

    - name: Wait for OpenCTI sync instances to start
      run: |
          set -eux
          ./scripts/ci/wait-for-url-200.sh http://localhost:4100/health?health_access_key=cihealthkey 300 10
          ./scripts/ci/wait-for-url-200.sh http://localhost:4200/health?health_access_key=cihealthkey 180 10
          ./scripts/ci/wait-for-url-200.sh http://localhost:4300/health?health_access_key=cihealthkey 180 10
          ./scripts/ci/wait-for-url-200.sh http://localhost:4400/health?health_access_key=cihealthkey 180 10

    - name: Start backend test (aka yarn test:ci-integration-sync)
      run: |
        docker run --network runner-docker-network \
          --name api-tests \
          -p 4010:4100 \
          --env-file ${{ github.workspace }}/scripts/ci/ci-common.env \
          -e APP__BASE_URL=http://api-tests:4010/ \
          -e APP__SYNC_RAW_START_REMOTE_URI=http://opencti-raw-start:4100/graphql \
          -e APP__SYNC_LIVE_START_REMOTE_URI=http://opencti-live-start:4100/graphql \
          -e APP__SYNC_DIRECT_START_REMOTE_URI=http://opencti-direct-start:4100/graphql \
          -e APP__SYNC_RESTORE_START_REMOTE_URI=http://opencti-restore-start:4100/graphql \
          -e PYTHONUNBUFFERED=1  \
          -e "APP__ENTERPRISE_EDITION_LICENSE=${{ env.EE_LICENSE }}" \
          filigran/builder:${{ github.sha }} \
          sh -c 'set -eux
            cd /opt/opencti/opencti-platform/opencti-graphql
            mkdir -p ../../opencti-connectors/stream/backup-files/src
            wget -O ../../opencti-connectors/stream/backup-files/src/backup-files.py https://raw.githubusercontent.com/OpenCTI-Platform/connectors/master/stream/backup-files/src/backup-files.py
            mkdir -p ../../opencti-connectors/external-import/restore-files/src
            wget -O ../../opencti-connectors/external-import/restore-files/src/restore-files.py https://raw.githubusercontent.com/OpenCTI-Platform/connectors/master/external-import/restore-files/src/restore-files.py
            apk add --no-cache git # required by pip to install pycti from a git reference
            yarn install:python
            NODE_OPTIONS=--max_old_space_size=8192 yarn test:ci-integration-sync --coverage
        '
        docker cp api-tests:/opt/opencti/opencti-platform/opencti-graphql/coverage opencti-platform/opencti-graphql/

    - name: Upload coverage to Codecov
      # Once per run, so coverage stays comparable whatever the matrix
      if: matrix.elasticsearch == '8'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ github.workspace }}/opencti-platform/opencti-graphql/coverage/coverage-final.json
        flags: opencti-graphql
        fail_ci_if_error: false
        override_branch: ${{ github.head_ref || github.ref_name }}
        override_commit: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Collect backend test result
      if: always()
      continue-on-error: true
      run: docker cp api-tests:/opt/opencti/opencti-platform/opencti-graphql/test-results opencti-platform/opencti-graphql/

    - name: Upload backend test result
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      continue-on-error: true
      with:
        name: backend-test-results-integration-es${{ matrix.elasticsearch }}
        path: ${{ github.workspace }}/opencti-platform/opencti-graphql/test-results
        retention-days: 10

    # Output all logs used during the job
    - name: Log backends (Minio, Elastic, RabbitMQ, Redis)
      if: always()
      continue-on-error: true
      run: |
          echo -e "\n\n ========== Logs Minio \n\n"; docker logs minio
          echo -e "\n\n ========== Logs Elastic search \n\n"; sleep 1; docker logs elasticsearch
          echo -e "\n\n ========== Logs RabbitMQ \n\n"; sleep 1; docker logs rabbitmq
          echo -e "\n\n ========== Logs Redis \n\n"; sleep 1; docker logs redis


    - name: Logs opencti-direct-start
      if: always()
      continue-on-error: true
      run: docker logs opencti-direct-start
    - name: Logs opencti-live-start
      if: always()
      continue-on-error: true
      run: docker logs opencti-live-start
    - name: Logs opencti-raw-start
      if: always()
      continue-on-error: true
      run: docker logs opencti-raw-start
    - name: Logs opencti-restore-start
      if: always()
      continue-on-error: true
      run: docker logs opencti-restore-start
    - name: Logs opencti-direct-worker
      if: always()
      continue-on-error: true
      run: docker logs opencti-direct-worker
    - name: Logs opencti-test-worker
      if: always()
      continue-on-error: true
      run: docker logs opencti-test-worker

    - name: Print resources stats
      if: always()
      continue-on-error: true
      run: cat runner_resource_stat.log

  run-opencti-rules-test:
    name: Rules and Taxii tests (Elasticsearch ${{ matrix.elasticsearch }})
    runs-on: ubuntu-26.04
    strategy:
      # A failure on one Elasticsearch major must not cancel the run on the other
      fail-fast: false
      matrix:
        elasticsearch: ${{ fromJSON(inputs.elasticsearch_versions) }}

    steps:
    - name: OpenCTI checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout_ref }}

    - name: Runner information
      continue-on-error: true
      run: ./scripts/ci/runner-info.sh # Display runner info and start resource monitoring in background

    - name: Fetch EE license
      run: |
        echo "EE_LICENSE=$(wget -qO- https://filigran.jfrog.io/artifactory/ci-utils/opencti-license/opencti_ee_ci_licence.crt | tr -d '\n')" >> "$GITHUB_ENV"

    - name: Download image builder
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: docker-image-opencti-builder
        path: /tmp

    - name: Download image worker
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: docker-image-opencti-worker
        path: /tmp

    - name: Load image
      run: |
          set -eux
          docker load --input /tmp/opencti-builder.tar   
          docker load --input /tmp/opencti-worker.tar   
          docker images

    - name: Set up Docker Compose for backends and sync instances
      env:
        # Empty for Elasticsearch 8: docker-compose.yml then keeps its default image
        ELASTICSEARCH_IMAGE: ${{ matrix.elasticsearch == '9' && 'elasticsearch:9.5.5' || '' }}
      run: |
         set -eux
         cd scripts/ci
         export TAG=${{ github.sha }}
         printf "\nAPP__ENTERPRISE_EDITION_LICENSE=\"%s\"" "$EE_LICENSE" >> ci-common.env
         docker network create runner-docker-network
         docker compose --profile "backend" --profile "ci-test-rules" up -d
         ./wait-for-url-200.sh http://localhost:9200/_cluster/health?wait_for_status=yellow  120 2

    - name: Start rules test and others (aka yarn test:ci-rules-and-others)
      run: |
        docker run --network runner-docker-network \
          --name api-tests \
          -p 4010:4100 \
          --env-file ${{ github.workspace }}/scripts/ci/ci-common.env \
          -e APP__BASE_URL=http://api-tests:4010/ \
          -e PYTHONUNBUFFERED=1  \
          -e "APP__ENTERPRISE_EDITION_LICENSE=${{ env.EE_LICENSE }}" \
          filigran/builder:${{ github.sha }} \
          sh -c 'set -eux
              cd /opt/opencti/opencti-platform/opencti-graphql
              mkdir -p ../../opencti-connectors/stream/backup-files/src
              wget -O ../../opencti-connectors/stream/backup-files/src/backup-files.py https://raw.githubusercontent.com/OpenCTI-Platform/connectors/master/stream/backup-files/src/backup-files.py
              mkdir -p ../../opencti-connectors/external-import/restore-files/src
              wget -O ../../opencti-connectors/external-import/restore-files/src/restore-files.py https://raw.githubusercontent.com/OpenCTI-Platform/connectors/master/external-import/restore-files/src/restore-files.py
              apk add --no-cache git # required by pip to install pycti from a git reference
              yarn install:python
              NODE_OPTIONS=--max_old_space_size=8192 yarn test:ci-rules-and-others --coverage
          '
        docker cp api-tests:/opt/opencti/opencti-platform/opencti-graphql/coverage opencti-platform/opencti-graphql/

    - name: Upload coverage to Codecov
      # Once per run, so coverage stays comparable whatever the matrix
      if: matrix.elasticsearch == '8'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ github.workspace }}/opencti-platform/opencti-graphql/coverage/coverage-final.json
        flags: opencti-graphql
        fail_ci_if_error: false
        override_branch: ${{ github.head_ref || github.ref_name }}
        override_commit: ${{ github.event.pull_request.head.sha || github.sha }}

    # Output all logs used during the job
    - name: Log backends (Minio, Elastic, RabbitMQ, Redis)
      if: always()
      continue-on-error: true
      run: |
          echo -e "\n\n ========== Logs Minio \n\n"; docker logs minio
          echo -e "\n\n ========== Logs Elastic search \n\n"; sleep 1; docker logs elasticsearch
          echo -e "\n\n ========== Logs RabbitMQ \n\n"; sleep 1; docker logs rabbitmq
          echo -e "\n\n ========== Logs Redis \n\n"; sleep 1; docker logs redis

    - name: Logs opencti-test-worker
      if: always()
      continue-on-error: true
      run: docker logs opencti-test-worker

    - name: Print resources stats
      if: always()
      continue-on-error: true
      run: cat runner_resource_stat.log

  run-opencti-backend-unit-test:
    name: Unit tests
    runs-on: ubuntu-26.04

    steps:
    - name: OpenCTI checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout_ref }}

    - name: Runner information
      continue-on-error: true
      run: ./scripts/ci/runner-info.sh # Display runner info and start resource monitoring in background

    - name: Download image builder
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: docker-image-opencti-builder
        path: /tmp

    - name: Load image
      run: |
          set -eux
          docker load --input /tmp/opencti-builder.tar   
          docker images

    - name: Backend type checking, linting and dependency check
      run: |
        docker run --name backend-lint \
          -v ${{ github.workspace }}/.gitignore:/opt/opencti/.gitignore:ro \
          --env-file ${{ github.workspace }}/scripts/ci/ci-common.env \
          -e PYTHONUNBUFFERED=1  \
          filigran/builder:${{ github.sha }} \
          sh -c 'set -eux
            cd /opt/opencti/opencti-platform/opencti-graphql
            yarn check-ts
            yarn lint
            # --dependencies only: the wider knip report (unused files and exports) still has a
            # large pre-existing backlog on both workspaces, so only declaration drift is enforced.
            yarn knip --dependencies
        '

    - name: Start unit tests (aka yarn test:ci-unit)
      if: '!cancelled()'
      run: |
        docker run --name unit-tests \
          -v ${{ github.workspace }}/opencti-platform/opencti-front/lang:/opt/opencti/opencti-platform/opencti-front/lang:ro \
          --env-file ${{ github.workspace }}/scripts/ci/ci-common.env \
          -e PYTHONUNBUFFERED=1  \
          filigran/builder:${{ github.sha }} \
          sh -c 'set -eux
            cd /opt/opencti/opencti-platform/opencti-graphql
            apk add --no-cache git # required by pip to install pycti from a git reference
            yarn install:python
            NODE_OPTIONS=--max_old_space_size=8192  yarn test:ci-unit --coverage
        '
        docker cp unit-tests:/opt/opencti/opencti-platform/opencti-graphql/coverage opencti-platform/opencti-graphql/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ github.workspace }}/opencti-platform/opencti-graphql/coverage/coverage-final.json
        flags: opencti-graphql
        fail_ci_if_error: false
        override_branch: ${{ github.head_ref || github.ref_name }}
        override_commit: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Print resources stats
      if: always()
      continue-on-error: true
      run: cat runner_resource_stat.log

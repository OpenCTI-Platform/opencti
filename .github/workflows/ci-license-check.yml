name: Verify licenses

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Reference of the branch or commit sha"
        type: string
        default: ${{ github.sha }}
    secrets:
      FDS_GIT_TOKEN:
        description: "Read token for the private @filigran/design-system git dependency"
        required: false

jobs:
  license-check:
    name: License check
    runs-on: ubuntu-latest
    steps:

    - name: OpenCTI checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout_ref }}

    - name: Runner information
      continue-on-error: true
      run: ./scripts/ci/runner-info.sh # Display runner info and start resource monitoring in background

    - name: Backend verify license
      run: |
        docker run  \
          --name backend-verify-licenses \
          -v ${{ github.workspace }}:/home/workspace \
          node:22-alpine3.23 \
          sh -c 'set -eux;
             npm install -g corepack
             cd /home/workspace/opencti-platform/opencti-graphql
             yarn install --mode=skip-build
             yarn verify-licenses
            '

    - name: Frontend verify license
      # See ci-test-frontend-quality.yml for why the token is passed by name and
      # the sh -c body stays single-quoted. Only the frontend needs it.
      env:
        FDS_GIT_TOKEN: ${{ secrets.FDS_GIT_TOKEN }}
      run: |
        docker run  \
          --name frontend-verify-licenses \
          -v ${{ github.workspace }}:/home/workspace \
          -e FDS_GIT_TOKEN \
          node:22-alpine3.23 \
          sh -c 'set -eux;
             apk --no-cache add git
             npm install -g corepack
             cd /home/workspace/opencti-platform/opencti-front
             set +x
             git config --global url."https://x-access-token:${FDS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
             set -x
             yarn install --mode=skip-build
             yarn verify-licenses
            '

    - name: Generate license
      run: |
        docker run  \
          --name generate-licenses \
          -v ${{ github.workspace }}:/home/workspace \
          node:22-alpine3.23 \
          sh -c 'set -eux;
             cd /home/workspace
             chmod 777 scripts/*
             ./scripts/generate-licenses.sh
             test -f ./licenses/third-party-licenses.txt
            '

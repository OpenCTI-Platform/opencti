# Design-system conformity for the wired zones: the generated token bridge must
# not have been hand-edited, the theme files must still import it, and no
# hardcoded value may return to a migrated zone.
#
# Blocking. `bridge-freshness` reports SKIPPED here rather than failing: it can
# only be computed against a theme.css, and CI has neither the library
# installed nor a sibling checkout. It becomes meaningful the day this product
# installs @filigran/design-system.
#
# No `paths:` filter, on purpose — a required check that never runs leaves
# unrelated PRs pending forever.
name: FDS conformity

on:
  pull_request:
  workflow_dispatch:

jobs:
  conformity:
    name: FDS conformity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node fds-migration/scripts/check-fds-conformity.mjs

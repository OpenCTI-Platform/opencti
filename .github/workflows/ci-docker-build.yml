name: Build OpenCTI Platform and worker images
# TO be removed when feature branch is refactor to new place.

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Image Tag"
        type: string
        default: ${{ github.sha }}
      checkout_ref:
        description: "Reference of the branch or commit sha"
        type: string
        default: ${{ github.sha }}
      client_python_local:
        description: "Use client python from the same commit"
        type: boolean
        required: false
        default: false
      publish_to_registry:
        description: "Publish image to registry. If false, will save the image as github artifact"
        type: string
        required: false
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        description: "Docker Hub username, required when publish_to_registry is true"
        required: false
      DOCKERHUB_TOKEN:
        description: "Docker Hub access token, required when publish_to_registry is true"
        required: false
      FDS_GIT_TOKEN:
        description: "Read token for the private @filigran/design-system git dependency"
        required: false
    outputs:
      image-tag-version-cleaned:
        description: "Image tag after formatting"
        value: ${{ jobs.build-opencti-platform.outputs.version }}
      image-tag-cleaned:
        description: "Image tags including image name after formatting"
        value: ${{ jobs.build-opencti-platform.outputs.tags }}

jobs:
  build-opencti-platform:
    name: Build OpenCTI Platform image
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout_ref }}

    - name: Use client-python in OpenCTI from same branch
      if: ${{ inputs.client_python_local == true }}
      env:
        CHECKOUT_REF: ${{ inputs.checkout_ref }}
      run: sed -i 's|^pycti==.*$|pycti @ git+https://github.com/OpenCTI-Platform/opencti@'"$CHECKOUT_REF"'#subdirectory=client-python|' -i ./opencti-platform/opencti-graphql/src/python/requirements.txt

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c #v4.2.0
      with:
        name: gha-builder-platform

    - name: Login to DockerHub
      if: inputs.publish_to_registry == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Docker meta (builder)
      id: meta-builder
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 #v6.2.0
      with:
        images: filigran/builder
        tags: type=raw,value=${{ inputs.image_tag }}

    - name: Build (builder)
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a #v7.3.0
      with:
        context: opencti-platform
        file: opencti-platform/Dockerfile
        target: builder
        outputs: type=docker,dest=/tmp/opencti-builder.tar
        tags: ${{ steps.meta-builder.outputs.tags }}
        labels: ${{ steps.meta-builder.outputs.labels }}

    - name: Upload builder docker image artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: docker-image-opencti-builder
        path: /tmp/opencti-builder.tar
        retention-days: 7

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 #v6.2.0
      with:
        images: filigran/platform
        tags: type=raw,value=${{ inputs.image_tag }}

    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a #v7.3.0
      with:
        context: opencti-platform
        file: opencti-platform/Dockerfile
        push: ${{ inputs.publish_to_registry == 'true' }}
        outputs: ${{ inputs.publish_to_registry == 'false' && 'type=docker,dest=/tmp/opencti-platform.tar' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # The `builder-front` stage installs @filigran/design-system, a private
        # git dependency, behind `RUN --mount=type=secret,id=fds_git_token`.
        # An unprovided BuildKit secret is not an empty file, it is no file at
        # all, so the step fails with "can't open /run/secrets/fds_git_token:
        # No such file or directory" — which reads like a missing secret even
        # when the secret exists. The `Build (builder)` step above stops at
        # `target: builder`, before the install, so it needs nothing.
        # Reusable workflows CAN read the secrets context (composite actions
        # cannot), but only what the caller passes — see FDS-WORKAROUND #1.
        secrets: |
          fds_git_token=${{ secrets.FDS_GIT_TOKEN }}

    - name: Upload opencti docker image artifact
      if: ${{ inputs.publish_to_registry == 'false' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: docker-image-opencti-platform
        path: /tmp/opencti-platform.tar
        retention-days: 7

  build-opencti-worker:
    name: Build OpenCTI Worker image
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout_ref }}

    - name: Use client-python in worker from same branch
      if: ${{ inputs.client_python_local == true }}
      env:
        CHECKOUT_REF: ${{ inputs.checkout_ref }}
      run: sed -i 's|^pycti==.*$|pycti @ git+https://github.com/OpenCTI-Platform/opencti@'"$CHECKOUT_REF"'#subdirectory=client-python|' -i ./opencti-worker/requirements.txt

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c #v4.2.0
      with:
        name: gha-builder-worker

    - name: Login to DockerHub
      if: inputs.publish_to_registry == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 #v6.2.0
      with:
        images: filigran/worker
        tags: type=raw,value=${{ inputs.image_tag }}

    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a #v7.3.0
      with:
        context: opencti-worker
        file: opencti-worker/Dockerfile
        push: ${{ inputs.publish_to_registry == 'true' }}
        outputs: ${{ inputs.publish_to_registry == 'false' && 'type=docker,dest=/tmp/opencti-worker.tar' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: docker-image-opencti-worker
        path: /tmp/opencti-worker.tar
        retention-days: 7
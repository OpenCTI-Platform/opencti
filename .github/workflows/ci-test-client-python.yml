name: Run Client Python - PyCti tests

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Reference of the branch or commit sha"
        type: string
        default: ${{ github.sha }}
    secrets:
      CODECOV_TOKEN:
        description: "Token used to upload coverage reports to Codecov"
        required: false

jobs:
  ensure-formatting-pycti:
    runs-on: ubuntu-latest
    name: pycti formatting check
    steps:
    - name: OpenCTI checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout_ref }}

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --package pycti --no-default-groups --group lint

    - name: Run isort check
      working-directory: client-python
      run: uv run --no-sync isort --check-only .

    - name: Run black check
      working-directory: client-python
      run: uv run --no-sync black --check .

    - name: flake8 Lint
      run: uv run --no-sync flake8 --ignore E,W client-python

  client-python-test:
    runs-on: ubuntu-latest
    name: pycti test - python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]
    steps:
    - name: OpenCTI checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout_ref }}

    - name: Runner information
      continue-on-error: true
      run: ./scripts/ci/runner-info.sh # Display runner info and start resource monitoring in background

    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install pycti and its test dependencies from the lockfile
      run: uv sync --locked --package pycti --no-default-groups --group test

    - name: Download image platform
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
      with:
        name: docker-image-opencti-platform
        path: /tmp

    - name: Load image
      run: |
          set -eux
          docker load --input /tmp/opencti-platform.tar
          docker images

    - name: Set up Docker Compose for backends
      run: |
         set -ex
         cd scripts/ci
         export TAG=${{ github.sha }}
         printf "\nAPP__ENTERPRISE_EDITION_LICENSE=\"$(wget -qO- https://filigran.jfrog.io/artifactory/ci-utils/opencti-license/opencti_ee_ci_licence.crt | tr -d '\n')\"" >> ci-common.env
         docker network create runner-docker-network
         docker compose --profile "backend" --profile "ci-test-pycti" up -d


    - name: Wait for OpenCTI e2e backend instances to start
      run: ./scripts/ci/wait-for-url-200.sh http://localhost:4600/health?health_access_key=cihealthkey 300 10

    - name: Test Client Python ${{ matrix.python-version }}
      working-directory: client-python
      env:
        OPENCTI_API_URL: http://localhost:4600
        OPENCTI_API_TOKEN: bfa014e0-e02e-4aa6-a42b-603b19dcf159
      run: |
        set -ex
        sleep 180
        uv run --no-sync pytest --no-header -vv --disable-warnings --cov=pycti --cov-report=xml:coverage.xml --drone

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f #v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ github.workspace }}/client-python/coverage.xml
        flags: opencti-client-python
        fail_ci_if_error: false
        override_branch: ${{ github.head_ref || github.ref_name }}
        override_commit: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Run pycti example tests
      working-directory: client-python/examples
      env:
        OPENCTI_API_URL: http://localhost:4600
        OPENCTI_API_TOKEN: bfa014e0-e02e-4aa6-a42b-603b19dcf159
      run: uv run --no-sync bash run_all.sh

    - name: Logs opencti-pycti-start
      if: always()
      continue-on-error: true
      run: docker logs opencti-pycti-start

    # Output all logs used during the job
    - name: Log backends (Minio, Elastic, RabbitMQ, Redis)
      continue-on-error: true
      run: |
          echo -e "\n\n ========== Logs Minio \n\n"; docker logs minio
          echo -e "\n\n ========== Logs Elastic search \n\n"; sleep 1; docker logs elasticsearch
          echo -e "\n\n ========== Logs RabbitMQ \n\n"; sleep 1; docker logs rabbitmq
          echo -e "\n\n ========== Logs Redis \n\n"; sleep 1; docker logs redis

    - name: Print resources stats
      if: always()
      continue-on-error: true
      run: cat runner_resource_stat.log

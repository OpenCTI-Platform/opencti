name: Renovate

# Self-hosted Renovate. It replaces the Mend-hosted Renovate app on this repository.
# The repository configuration stays in renovate.json5. This workflow only sets the global configuration.
#
# Setup:
# - A GitHub App installed on this repository, with read and write access to:
#   Contents, Pull requests, Issues, Workflows, Checks and Commit statuses.
# - Repository variable RENOVATE_APP_CLIENT_ID: the App client ID.
# - Repository variable RENOVATE_APP_SLUG: the App slug, for example opencti-renovate.
# - Repository variable RENOVATE_APP_USER_ID: the user ID of the App bot account.
#   It is given by `gh api /users/<slug>[bot] --jq .id`.
# - Repository secret RENOVATE_APP_PRIVATE_KEY: the App private key.
# - The Mend Renovate app is removed from this repository.

on:
  schedule:
    # Every hour. The schedule in renovate.json5 decides which updates run.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        type: choice
        default: info
        options:
          - info
          - debug
      repoCache:
        description: 'Repository cache'
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
          - reset
  # A person checks a box in the Dependency Dashboard or in a Renovate pull request.
  issues:
    types: [edited]
  pull_request:
    types: [edited]

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

env:
  cache_dir: /tmp/renovate/cache/renovate/repository
  cache_key: renovate-repository-cache

jobs:
  renovate:
    name: Renovate
    # Events from the bot itself are ignored. Renovate edits the dashboard and its pull requests on each run.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
        github.event.issue.title == 'Dependency Dashboard' &&
        github.event.sender.type == 'User') ||
      (github.event_name == 'pull_request' &&
        startsWith(github.head_ref, 'renovate/') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.sender.type == 'User')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Restore Renovate repository cache
        id: cache-restore
        if: inputs.repoCache != 'disabled' && inputs.repoCache != 'reset'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.cache_key }}-

      # Renovate runs in its container as user 12021.
      - name: Fix restored cache ownership
        if: steps.cache-restore.outputs.cache-matched-key != ''
        run: sudo chown -R 12021:0 /tmp/renovate/

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Renovate updates this version itself (docker image ghcr.io/renovatebot/renovate).
          renovate-version: 44.257.5
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_USERNAME: ${{ vars.RENOVATE_APP_SLUG }}[bot]
          RENOVATE_GIT_AUTHOR: ${{ vars.RENOVATE_APP_SLUG }}[bot] <${{ vars.RENOVATE_APP_USER_ID }}+${{ vars.RENOVATE_APP_SLUG }}[bot]@users.noreply.github.com>
          # Commits are made through the GitHub API, so GitHub signs them. The master ruleset requires signed commits.
          RENOVATE_PLATFORM_COMMIT: enabled
          # Branches written by the Mend Renovate app are not treated as modified by someone else.
          RENOVATE_GIT_IGNORED_AUTHORS: '["29139614+renovate[bot]@users.noreply.github.com"]'
          # Pull requests and the Dependency Dashboard created by the Mend Renovate app are managed too.
          RENOVATE_IGNORE_PR_AUTHOR: 'true'
          RENOVATE_REPOSITORY_CACHE: ${{ inputs.repoCache || 'enabled' }}

      - name: Save Renovate repository cache
        if: inputs.repoCache != 'disabled' && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}

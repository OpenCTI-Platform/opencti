name: PoC testcontainers measure (temporary)
# Temporary workflow for the testcontainers PoC (phase 0): measures backend container startup and memory on a CI runner.
# To be removed before any merge.

on:
  push:
    branches:
      - poc-testcontainers
    paths:
      - '.github/workflows/poc-testcontainers-measure.yml'
      - 'opencti-platform/opencti-graphql/script/poc-testcontainers-measure.ts'

jobs:
  measure:
    name: Measure backend containers
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: opencti-platform/opencti-graphql
        run: |
          npm install -g corepack
          yarn install --immutable --mode=skip-build

      - name: Runner information
        run: |
          nproc
          free -m
          docker version --format '{{.Server.Version}}'

      - name: Measure
        working-directory: opencti-platform/opencti-graphql
        run: node script/poc-testcontainers-measure.ts 5 | tee measure-ci.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: poc-testcontainers-measure
          path: opencti-platform/opencti-graphql/measure-ci.json
          retention-days: 10

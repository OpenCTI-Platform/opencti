name: Deploy feature branch on staging
on:
  workflow_dispatch:
    inputs:
      octi_config:
        description: JSON object (or object fields) for front-end environment variables
        type: string
        default: '{}'
        required: false
      upgrade_from_58:
        description: Whether to upgrade from 5.8
        type: boolean
        required: false
        default: false
      redis_cluster:
        description: Redis cluster (sentinel) ?
        type: boolean
        required: false
        default: false
      client_python_local:
        description: Use client-python from this branch instead of the released pycti
        type: boolean
        required: false
        default: false

jobs:
  wf-build-image:
    name: Build image
    uses: ./.github/workflows/ci-docker-build.yml
    with:
      image_tag: ${{ github.ref_name }}
      client_python_local: ${{ inputs.client_python_local }}
      publish_to_registry: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}


  deploy:
    name: deploy
    needs: wf-build-image
    runs-on: ubuntu-latest
    steps:
      - run: if [ "${{ inputs.upgrade_from_58 }}" == "true" ]; then ID=67; else ID=66; fi; echo "AWX_TPL_ID=$ID" >> "$GITHUB_ENV"

      - name: Install AWX cli
        run: pip install awxkit

      - name: Deploy feature environment via AWX
        env:
          AWX_URL: ${{ secrets.AWX_URL }}
          AWX_USER: ${{ secrets.AWX_USER }}
          AWX_PASSWORD: ${{ secrets.AWX_PASSWORD }}
          OCTI_VERSION: ${{ needs.wf-build-image.outputs.image-tag-version-cleaned }}
          OCTI_CONFIG: ${{ inputs.octi_config }}
          REDIS_CLUSTER: ${{ inputs.redis_cluster }}
        run: |
          octi_config="$OCTI_CONFIG"
          if ! jq -e 'type == "object"' <<< "$octi_config" >/dev/null 2>&1; then
            octi_config="{$octi_config}"
          fi
          extra_vars=$(jq -cn \
            --arg octi_version "$OCTI_VERSION" \
            --argjson octi_config "$octi_config" \
            --argjson redis_cluster "$REDIS_CLUSTER" \
            '{octi_version: $octi_version, octi_config: $octi_config, redis_cluster: $redis_cluster}')
          awx --conf.host "$AWX_URL" \
            --conf.username "$AWX_USER" \
            --conf.password "$AWX_PASSWORD" \
            job_templates launch 'Deploy OpenCTI feature branch for testing' \
            --wait \
            --inventory eu-west-staging \
            --extra_vars "$extra_vars" \
            -f human
      - name: Forge URL to match playbook limitations
        id: urlforge
        run: |
          url=$(echo "${{ needs.wf-build-image.outputs.image-tag-version-cleaned }}" | cut -c 1-15 | sed 's/[_.]/-/g' | sed 's/-*$//')
          echo "url=$url" >> $GITHUB_OUTPUT
      - name: display URL
        run: echo "https://feat-${{steps.urlforge.outputs.url}}.octi.staging.filigran.io"
